name: MiniCPM retained merger-list scope analysis v2
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed exact forty-hex analysis-only source
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: minicpm-retained-analysis-v2
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      KAGGLE_ACCOUNT: ${{ secrets.KAGGLE_ACCOUNT }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact new closure, original frame and source-only shape controls
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'tools/minicpm-retained-analysis-v2')
          import analysis_contract as c
          c.source_guard(os.environ['SOURCE_REF'])
          PY
          python tools/minicpm-retained-v3/common.py analysis --reviewed-source "$SOURCE_REF" --out "$RUNNER_TEMP/mini-out" --scratch "$RUNNER_TEMP/mini-stage"
          python tests/test_minicpm_retained_analysis_v2.py -v
      - name: Isolated numerical and exact-version read tools only
        run: |
          python -m venv "$RUNNER_TEMP/mini-tools"
          echo "$RUNNER_TEMP/mini-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mini-tools/bin/python" -m pip install --index-url https://pypi.org/simple numpy==2.2.6 gguf==0.17.1 kaggle==2.2.2
      - name: Same83 model-free actual Ref comparator only
        run: python tools/minicpm-retained-v3/build.py analysis --reviewed-source "$SOURCE_REF" --build "$RUNNER_TEMP/mini-build" --stage "$RUNNER_TEMP/mini-stage" --out "$RUNNER_TEMP/mini-out"
      - name: Exact retained arrays and original identity; no checkpoints
        run: python tools/minicpm-retained-v3/fetch.py analysis --reviewed-source "$SOURCE_REF" --stage "$RUNNER_TEMP/mini-stage" --out "$RUNNER_TEMP/mini-out"
      - name: Carry36 old Ref rows and compute only102 missing pairs
        run: |
          python tools/minicpm-retained-v3/launch.py --timeout 10800 --receipt "$RUNNER_TEMP/mini-out/analysis-process.json" -- python tools/minicpm-retained-analysis-v2/analyze.py --reviewed-source "$SOURCE_REF" --build-receipt "$RUNNER_TEMP/mini-out/build-analysis.json" --retained "$RUNNER_TEMP/mini-stage/retained" --reference "$RUNNER_TEMP/mini-stage/original" --scratch "$RUNNER_TEMP/mini-work" --out "$RUNNER_TEMP/mini-out/analysis" --diff "$RUNNER_TEMP/mini-build/probe/minicpm-graph-diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minicpm-retained-analysis-v2-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mini-out/*.json
            ${{ runner.temp }}/mini-out/*.log
            ${{ runner.temp }}/mini-out/analysis/**/*.json
            ${{ runner.temp }}/mini-out/analysis/**/*.log
          retention-days: 90
          if-no-files-found: warn
