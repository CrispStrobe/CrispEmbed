name: OvisOCR2 paired profiling attribution
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ovisocr2-profiling-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure contract controls and immutable model/source preflight
        run: |
          python tests/test_qwen35_profiling.py -v
          python tests/test_ovisocr2_profiling.py -v
          python tools/ci-heavy/ovisocr2_profiling.py --preflight
      - name: Actual hosted paired profiling and output neutrality
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          echo "HEAVY_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          HEAVY_OUT="$RUNNER_TEMP/out" HEAVY_SCRATCH="$RUNNER_TEMP/scratch" python tools/ci-heavy/ovisocr2_profiling.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr2-profiling-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 90
