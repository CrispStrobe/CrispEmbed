name: Marker Apple consumers

# An independent, bounded feature-lane proof. The ordinary Build workflow and
# its required checks retain their own selector, results and acceptance gates.
# Apple work does not depend on an Ubuntu selector runner becoming available.
on:
  push:
    branches: [feature/pdf-craft-document-quality-20261109]
    paths:
      - '.github/workflows/marker-apple-consumers.yml'
      - '.github/actions/compiler-cache/**'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'src/**'
      - 'ggml'
      - 'ggml/**'
      - 'tests/test-marker-*.cpp'
      - 'tests/marker_pdfium_fixture.cpp'
      - 'tests/test_flutter_pod_resources.py'
      - 'scripts/check-cpu-baseline.py'
      - 'flutter/crispembed/pubspec.yaml'
      - 'flutter/crispembed/LICENSE'
      - 'flutter/crispembed/NOTICE.*'
      - 'flutter/crispembed/Apache-2.0.txt'
      - 'flutter/crispembed/ios/**'
      - 'flutter/crispembed/macos/**'
      - 'LICENSE'
      - 'NOTICE.*'
      - 'licenses/oxr-*'
      - 'models/licenses/apache-2.0/LICENSE'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Preserve an executing source-pinned consumer when another feature checkpoint
# arrives. A queued successor still carries its own exact source and receipts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  consumer:
    name: Marker ${{ matrix.platform }} consumer
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    env:
      OMP_NUM_THREADS: '2'
      CRISPEMBED_OFFLINE: '1'
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/compiler-cache
        with:
          namespace: ${{ matrix.platform == 'macos' && 'desktop-macos-arm64-release-portable' || 'ios-arm64-release-metal' }}

      - name: Record actual Apple source and toolchain
        env:
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p proof-native
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          sources = ['CMakeLists.txt', 'cmake/MarkerIdentity.cmake', 'src/crispembed.h',
                     'src/marker.cpp', 'src/marker_artifact.cpp', 'src/marker_document.cpp',
                     'src/marker_backend.cpp', 'tests/test_flutter_pod_resources.py',
                     'flutter/crispembed/ios/crispembed.podspec',
                     'flutter/crispembed/macos/crispembed.podspec']
          data = {
              'schema_version': 1, 'platform': os.environ['APPLE_PLATFORM'],
              'source_commit': command('git', 'rev-parse', 'HEAD'),
              'source_tree': command('git', 'rev-parse', 'HEAD^{tree}'),
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'architecture': platform.machine(), 'os': platform.mac_ver()[0],
              'xcode': command('xcodebuild', '-version'),
              'clang': command('xcrun', 'clang', '--version').splitlines()[:3],
              'cmake': command('cmake', '--version').splitlines()[0],
              'cocoapods': command('pod', '--version'),
              'source_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sources},
              'signing_identity_used': False, 'models_downloaded': False,
              'ios_device_runtime_qualified': False, 'flutter_sdk_app_qualified': False,
              'limits': 'Independent native Apple build and CocoaPods consumer. No ordinary required-gate result is changed. The existing macOS flatten helper uses local ad-hoc binary signatures after install-name edits; application signing is disabled. No publication or model inference.',
          }
          Path('proof-native/build.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          ruby -c flutter/crispembed/ios/crispembed.podspec
          ruby -c flutter/crispembed/macos/crispembed.podspec

      - name: Build actual macOS library and Marker controls
        if: matrix.platform == 'macos'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCRISPEMBED_BUILD_SHARED=ON -DCRISPEMBED_NATIVE=OFF -DGGML_NATIVE=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple
          python3 scripts/check-cpu-baseline.py build
          cmake --build build -j4 --target crispembed-shared test-marker-document \
            test-marker-artifact test-marker-lifecycle test-marker-api test-marker-backend test-marker-save
          for target in test-marker-document test-marker-artifact test-marker-lifecycle test-marker-api test-marker-backend test-marker-save; do
            "./build/$target" 2>&1 | tee "proof-native/$target.log"
          done

      - name: Build actual iOS device-SDK static library
        if: matrix.platform == 'ios'
        run: |
          cmake -S . -B build -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_C_COMPILER="$(xcrun --sdk iphoneos -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --sdk iphoneos -f clang++)" \
            -DCMAKE_BUILD_TYPE=Release -DCRISPEMBED_BUILD_SHARED=OFF \
            -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build build -j4 --target crispembed

      - name: Stage the actual native dependency closure and exact notices
        env:
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path
          package = Path('native-package')
          package.mkdir()
          if os.environ['APPLE_PLATFORM'] == 'macos':
              paths = list(Path('build').glob('libcrispembed*.dylib'))
              paths += list(Path('build/ggml').rglob('*.dylib'))
              assert paths and len(paths) == len({path.name for path in paths})
              for path in paths:
                  shutil.copy2(path, package / path.name, follow_symlinks=False)
              # These are build outputs, not CMake-installed files. Match the
              # release recipe so the consumer cannot resolve sibling dylibs
              # through an absolute build-tree RPATH left on the same runner.
              def rpaths(path):
                  output = subprocess.check_output(['otool', '-l', str(path)], text=True)
                  return re.findall(r'cmd LC_RPATH\s+cmdsize [^\n]+\s+path (.*?) \(offset \d+\)', output)
              for path in package.glob('*.dylib'):
                  if path.is_symlink():
                      continue
                  for previous in rpaths(path):
                      subprocess.run(['install_name_tool', '-delete_rpath', previous, str(path)], check=True)
                  subprocess.run(['install_name_tool', '-add_rpath', '@loader_path', str(path)], check=True)
              subprocess.run(['sh', 'flutter/crispembed/macos/flatten_dylibs.sh', str(package)], check=True)
              subprocess.run(['sh', 'flutter/crispembed/macos/flatten_dylibs.sh', '--check', str(package)], check=True)
              for path in package.glob('*.dylib'):
                  assert rpaths(path) == ['@loader_path'], path.name
                  # RPATH edits invalidate even a library whose install name
                  # was already flat. This is local ad-hoc signing only.
                  subprocess.run(['codesign', '--force', '--sign', '-', str(path)], check=True)
                  subprocess.run(['codesign', '--verify', str(path)], check=True)
          else:
              paths = [Path('build/libcrispembed-static.a'), Path('build/libcrispembed-core.a')]
              paths += sorted(Path('build/ggml').rglob('libggml*.a'))
              assert all(path.is_file() for path in paths) and len(paths) >= 5
              assert len(paths) == len(set(paths))
              subprocess.run(['xcrun', 'libtool', '-static', '-o', str(package / 'libcrispembed-static.a'),
                              *map(str, paths)], check=True)
          notices = {
              'LICENSE': 'LICENSE', 'NOTICE.marker': 'NOTICE.marker',
              'NOTICE.teleocr': 'NOTICE.teleocr', 'oxr-LICENSE': 'licenses/oxr-LICENSE',
              'oxr-NOTICE': 'licenses/oxr-NOTICE', 'Apache-2.0.txt': 'models/licenses/apache-2.0/LICENSE',
          }
          for name, source in notices.items():
              data = Path(source).read_bytes()
              (package / name).write_bytes(data)
              assert (package / name).read_bytes() == data, name
          PY

      - name: Archive and read back native payload and notice bytes
        env:
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tarfile
          from pathlib import Path
          package = Path('native-package')
          files = sorted(package.iterdir())
          assert files and all(path.is_file() and not path.is_symlink() for path in files)
          expected = {path.name: {'bytes': path.stat().st_size,
                                 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files}
          archive = Path('proof-native/native-package.tar.gz')
          with tarfile.open(archive, 'w:gz') as stream:
              for path in files:
                  stream.add(path, arcname=path.name, recursive=False)
          with tarfile.open(archive, 'r:gz') as stream:
              members = stream.getmembers()
              assert len(members) == len(expected) and {item.name for item in members} == set(expected)
              for item in members:
                  assert item.isfile() and '/' not in item.name and item.name not in ('.', '..')
                  data = stream.extractfile(item).read()
                  assert len(data) == expected[item.name]['bytes']
                  assert hashlib.sha256(data).hexdigest() == expected[item.name]['sha256']
          data = {
              'schema_version': 1, 'platform': os.environ['APPLE_PLATFORM'],
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'archive_bytes': archive.stat().st_size, 'members': expected,
              'required_notices': ['LICENSE', 'NOTICE.marker', 'NOTICE.teleocr', 'oxr-LICENSE', 'oxr-NOTICE', 'Apache-2.0.txt'],
              'native_archive_readback_passed': True, 'release_published': False,
          }
          assert all(name in expected for name in data['required_notices'])
          Path('proof-native/package-readback.json').write_text(json.dumps(data, indent=2) + '\n')
          print('Native archive readback passed:', len(expected), 'exact members')
          PY

      - name: Retain native archive for independent remote readback
        uses: actions/upload-artifact@v4
        with:
          name: marker-apple-${{ matrix.platform }}-native-${{ github.sha }}
          path: |
            proof-native/native-package.tar.gz
            proof-native/package-readback.json
          if-no-files-found: error
          retention-days: 90

      - name: Actual Release CocoaPods path and dynamic-lookup consumer
        timeout-minutes: 12
        run: >-
          python3 tests/test_flutter_pod_resources.py --platform ${{ matrix.platform }}
          --native-dir native-package --out build/cocoapods-${{ matrix.platform }}

      - name: Retain compact source and consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-apple-${{ matrix.platform }}-proof-${{ github.sha }}
          path: |
            proof-native/build.json
            proof-native/*.log
            build/cocoapods-${{ matrix.platform }}/receipt.json
            build/cocoapods-${{ matrix.platform }}/*.log
            build/cocoapods-${{ matrix.platform }}/**/Podfile*
          if-no-files-found: warn
          retention-days: 90
