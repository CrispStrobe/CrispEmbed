name: OvisOCR3 original HF full reference
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reviewed OvisOCR3 metadata and service gate before dependencies or weights
        run: |
          mkdir -p "$RUNNER_TEMP/ovisocr3-reference/out" "$RUNNER_TEMP/ovisocr3-reference/scratch"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/ovisocr3-reference/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/ovisocr3-reference/scratch"
            echo "HF_HOME=$RUNNER_TEMP/ovisocr3-reference/scratch/hf"
          } >> "$GITHUB_ENV"
          HEAVY_OUT="$RUNNER_TEMP/ovisocr3-reference/out" HEAVY_SCRATCH="$RUNNER_TEMP/ovisocr3-reference/scratch" \
            python tools/ci-heavy/ovisocr3_reference.py --preflight
      - name: Pinned original CPU/F32 reference stack
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 pillow==12.1.0 huggingface-hub==1.33.0 gguf==0.19.0 safetensors==0.8.0
          python -m pip freeze > "$HEAVY_OUT/environment.txt"
      - name: Replay all three original processor anchors then capture 943-stage reference
        run: python tools/ci-heavy/ovisocr3_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-reference-reports-${{ github.run_id }}
          path: ${{ env.HEAVY_OUT }}/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ovisocr3-reference-${{ github.run_id }}
          path: |
            ${{ env.HEAVY_SCRATCH }}/ovisocr3-reference/ovisocr3-original.npz
            ${{ env.HEAVY_SCRATCH }}/ovisocr3-reference/ovisocr3-original.json
            ${{ env.HEAVY_SCRATCH }}/ovisocr3-reference/official-delta.gguf
            ${{ env.HEAVY_SCRATCH }}/ovisocr3-reference/owned-readable.png
          if-no-files-found: error
          retention-days: 90
