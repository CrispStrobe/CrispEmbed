name: LightOn4B frozen component replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact retained negative artifact and verify archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/CrispStrobe/CrispEmbed/actions/artifacts/13367509290/zip > "$RUNNER_TEMP/frozen.zip"
          echo 'e90d303546d53e0d7352f43ae2e8362063dbb9bb901c0a2b7613a59af5e65532  '"$RUNNER_TEMP/frozen.zip" | sha256sum --check
          python -m zipfile -e "$RUNNER_TEMP/frozen.zip" "$RUNNER_TEMP/frozen"
      - name: Install array reader only; replay native from frozen original bytes
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python tools/ci-heavy/lighton4b_gdn_retained_replay.py \
            --retained "$RUNNER_TEMP/frozen" --output "$RUNNER_TEMP/replay" \
            --build-dir "$RUNNER_TEMP/replay-build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton4b-retained-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/replay/
          retention-days: 90
          if-no-files-found: warn
