name: UltraBERT source contract
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ultrabert-contract.yml'
      - 'tools/ultrabert_contract.py'
      - 'tools/dump_ultrabert_reference.py'
      - 'tools/dump_ultrabert_linear_reference.py'
      - 'tests/test_ultrabert_linear_capture.py'
      - '.github/workflows/ultrabert-native.yml'
      - 'tools/ci-heavy/ultrabert_reference.py'
      - 'tools/ci-heavy/ultrabert_native.py'
      - 'tests/test_ultrabert_diff.cpp'
      - 'tests/test_ultrabert_native_log.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'tests/test_ultrabert_contract.py'
      - 'tests/results/ultrabert/**'
  pull_request:
    paths:
      - '.github/workflows/ultrabert-contract.yml'
      - 'tools/ultrabert_contract.py'
      - 'tools/dump_ultrabert_reference.py'
      - 'tools/dump_ultrabert_linear_reference.py'
      - 'tests/test_ultrabert_linear_capture.py'
      - '.github/workflows/ultrabert-native.yml'
      - 'tools/ci-heavy/ultrabert_reference.py'
      - 'tools/ci-heavy/ultrabert_native.py'
      - 'tests/test_ultrabert_diff.cpp'
      - 'tests/test_ultrabert_native_log.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'tests/test_ultrabert_contract.py'
      - 'tests/results/ultrabert/**'
permissions:
  contents: read
# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: ultrabert-contract-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_ultrabert_contract.py -v
      - run: python tests/test_ultrabert_native_log.py -v
