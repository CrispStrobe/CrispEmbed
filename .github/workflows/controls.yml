permissions:
  contents: read
# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: controls-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lighton4b_reference: ${{ steps.lighton4b-scope.outputs.run_reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bounded LightOn4B reference from complete changes
        id: lighton4b-scope
        run: python tools/lighton4b_ci.py --github-output "$GITHUB_OUTPUT"
      - name: Validate manual OCR workflow contexts and routing
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/heavy-cpu.yml .github/workflows/controls.yml
      - name: UltraBERT source contract
        if: ${{ !cancelled() }}
        run: |
          python tests/test_ultrabert_contract.py -v
          python tests/test_ultrabert_native_log.py -v
      - name: UltraBERT SciFact protocol controls
        if: ${{ !cancelled() }}
        run: python tests/test_ultrabert_scifact.py -v
      - name: UltraBERT retrieval smoke scorer controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_ultrabert_retrieval.py -v
          python tests/test_ultrabert_retrieval_producer.py -v

      - name: OCR document structure and provenance controls
        if: ${{ !cancelled() }}
        run: python tests/test_ocr_document_eval.py -v

      - name: Retained OCR report extraction controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_extract_ocr_nov4_evidence.py -v
          python tests/test_extract_ocr_followup_evidence.py -v
          python tests/test_preserve_ocr_nov4_archives.py -v

      - name: Nemotron Parse source and tensor census controls
        if: ${{ !cancelled() }}
        run: python tests/test_nemotron_parse_contract.py -v

      - name: LightOn 0.8B retained final-logit coverage controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_lighton08_precision_review.py -v
          python tests/test_lighton08_portable.py -v

      - name: Install small numerical-control dependency
        if: ${{ !cancelled() }}
        run: python -m pip install numpy==2.3.5

      - name: OvisOCR3 separate document task and preserved plain OCR failure
        if: ${{ !cancelled() }}
        run: |
          python tools/ovisocr3_document_contract.py
          python tests/test_ovisocr3_document_contract.py -v

      - name: MinerU 2605 and preserved 2604 source controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_mineru2605_contract.py -v
          python tests/test_mineru2605_cpu_provider.py -v
          python tests/test_mineru25_conversion.py -v

      - name: LightOnOCR-3-1B profile and grounding controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_lightonocr3_profile.py -v
          # The v1 owned-source guard remains frozen for its exact producer.
          # Current native ownership is checked by the separate KV protocol.
          python tests/test_lighton3_pixtral_eps_ab.py Controls.test_only_elapsed_time_can_differ_in_gate0_trace Controls.test_tensor_byte_inventory_and_decoded_changes_rejected -v
          python tests/test_lighton3_kv_f32_ab.py -v
          python tests/test_lighton3_kv_complete_first.py -v
          python tests/test_lighton3_kv_remaining.py -v
          python tests/test_validate_lighton3_eps_first.py -v

      - name: LightOnOCR-3-4B source preflight controls
        if: ${{ !cancelled() }}
        run: python tests/test_lightonocr3_4b_profile.py -v

      - name: LightOnOCR-3-4B export and component protocol controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_lightonocr3_4b_export.py -v
          python tests/test_lightonocr3_4b_export_meta.py -v
          python tests/test_lighton4b_gdn_reference.py -v
          python tests/test_lighton4b_ci.py -v

      - name: Xiaomi OCR0 exact source, task and layout controls
        if: ${{ !cancelled() }}
        run: |
          python tests/test_xiaomi0_profile.py -v
          python tests/test_xiaomi0_runner.py -v
          python tests/test_xiaomi0_document.py -v

      - name: Nemotron processor-reference receipt controls
        if: ${{ !cancelled() }}
        run: python tests/test_nemotron_parse_frontend.py -v

  lighton4b-reference:
    name: LightOn4B original meta schema and GDN components
    needs: controls
    if: needs.controls.outputs.lighton4b_reference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated pinned CPU reference environment
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/lighton4b-reference/environment"
          python -m venv "$RUNNER_TEMP/lighton4b-reference-venv"
          "$RUNNER_TEMP/lighton4b-reference-venv/bin/python" -m pip install \
            --disable-pip-version-check --report "$RUNNER_TEMP/lighton4b-reference/environment/resolution.json" \
            -r tools/lighton4b-gdn-requirements.txt
          "$RUNNER_TEMP/lighton4b-reference-venv/bin/python" -m pip check | tee "$RUNNER_TEMP/lighton4b-reference/environment/pip-check.txt"
          "$RUNNER_TEMP/lighton4b-reference-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/lighton4b-reference/environment/installed.txt"
      - name: Observe actual original 4B meta schema without checkpoint weights
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          "$RUNNER_TEMP/lighton4b-reference-venv/bin/python" tools/ci-heavy/lighton4b_export_meta.py \
            --output "$RUNNER_TEMP/lighton4b-reference/meta/export-meta.json"
      - name: Freeze original components then compare native recurrence and caches
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          "$RUNNER_TEMP/lighton4b-reference-venv/bin/python" tools/ci-heavy/lighton4b_gdn_reference.py \
            --output "$RUNNER_TEMP/lighton4b-reference/gdn" \
            --build-dir "$RUNNER_TEMP/lighton4b-gdn-build"
      - name: Retain original and native component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighton4b-components-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton4b-reference/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
