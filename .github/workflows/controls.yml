name: Model-free controls
# Consolidates tiny stdlib-python control/contract workflows that each ran for
# seconds but cost a full runner queue slot (2026-11-02). Former files:
#   ultrabert-contract.yml          -> step "UltraBERT source contract"
#   ultrabert-scifact-controls.yml  -> step "UltraBERT SciFact protocol controls"
#   ultrabert-retrieval.yml         -> step "UltraBERT retrieval smoke scorer controls"
# Triggers are the union of the former path filters; every control runs on any
# trigger (they take seconds), so no control is skipped that used to run.
