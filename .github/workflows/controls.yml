      - 'tools/ci-heavy/extract_ocr_nov4_evidence.py'
      - 'tools/ci-heavy/extract_ocr_followup_evidence.py'
      - 'tests/test_extract_ocr_followup_evidence.py'
      - 'tests/test_extract_ocr_nov4_evidence.py'
      # Versioned document diagnostics (stdlib; no model execution)
      - 'tools/ocr_document_eval.py'
      - 'tests/test_ocr_document_eval.py'
      - 'models/convert-lightonocr-to-gguf.py'
      - 'models/lightonocr3*'
      - 'tools/*lightonocr3*.py'
      - 'tools/ci-heavy/lightonocr3_1b.*'
      - 'tests/test_lightonocr3_profile.py'
      - 'tests/fixtures/lightonocr3/**'
      - 'models/qwen35_xiaomi0_profile.py'
      - 'models/convert-qwen35-ocr-to-gguf.py'
      - 'tools/xiaomi0*.py'
      - 'tools/ci-heavy/xiaomi0*'
      - 'tests/test_xiaomi0*.py'
      - 'tests/fixtures/xiaomi0-*/**'
      - 'tests/results/qwen35-ocr/xiaomi0-source-contract.json'
      - 'models/convert-mineru25-pro-to-gguf.py'
      - 'models/mineru25-pro-2605-source.json'
      - 'tools/mineru2605_*.py'
      - 'tools/ci-heavy/mineru2605_qualify.sh'
      - 'tests/test_mineru2605_contract.py'
      - 'tests/test_mineru2605_cpu_provider.py'
      - 'tools/kaggle/mineru2605-cpu/**'
      - 'tests/test_mineru25_conversion.py'
      - 'tests/fixtures/mineru2605/**'
      - 'docs/mineru25-pro-2605-protocol.json'
      - 'tools/lighton08_precision_review.py'
      - 'tests/test_lighton08_precision_review.py'
      - 'tools/ci-heavy/lighton08_portable.*'
      - 'tests/test_lighton08_portable.py'
      - 'tests/fixtures/lighton08-portable/**'
      - 'tools/ovisocr3_document_contract.py'
      - 'tests/test_ovisocr3_document_contract.py'
      - 'tests/fixtures/ovisocr3-document-source/**'
      - 'docs/ovisocr3-document-protocol.json'
      - 'tests/results/qwen35-ocr/ovisocr3-source-contract.json'
      - 'tests/results/qwen35-ocr/ovisocr3-quality-panel.json'
      - 'tests/results/qwen35-ocr/ovisocr3-original-quality.json'
      - 'tests/results/qwen35-ocr/ovisocr3-f16-quality.json'
      - 'tests/results/qwen35-ocr/quality.json'
      - 'tests/results/qwen35-ocr/quality-quant-*.json'
      - 'models/nemotron-parse-source.json'
      - 'tools/nemotron_parse_contract.py'
      - 'tests/test_nemotron_parse_contract.py'
      - 'tools/nemotron_parse_frontend*'
      - 'tools/ci-heavy/nemotron_parse_frontend.sh'
      - 'tests/test_nemotron_parse_frontend.py'
      - 'tests/regression/nemotron-parse/**'
      # UltraBERT source contract
      - 'tools/ultrabert_contract.py'
      - 'tools/dump_ultrabert_reference.py'
      - 'tools/dump_ultrabert_linear_reference.py'
      - 'tests/test_ultrabert_linear_capture.py'
      - '.github/workflows/ultrabert-native.yml'
      - 'tools/ci-heavy/ultrabert_reference.py'
      - 'tools/ci-heavy/ultrabert_native.py'
      - 'tests/test_ultrabert_diff.cpp'
      - 'tests/test_ultrabert_native_log.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'tests/test_ultrabert_contract.py'
      - 'tests/results/ultrabert/**'
      # UltraBERT SciFact protocol controls
      - 'tools/ultrabert_scifact.py'
      - 'tools/ci-heavy/ultrabert_scifact.py'
      - 'tests/test_ultrabert_scifact.py'
      - 'tests/regression/ultrabert/scifact-protocol-v1.json'
      - '.github/workflows/ultrabert-scifact*.yml'
      - '.github/actions/scifact-setup/action.yml'
      # UltraBERT retrieval smoke scorer controls
      - 'tools/ultrabert_retrieval.py'
      - 'tools/ci-heavy/ultrabert_retrieval.py'
      - 'tests/test_ultrabert_retrieval_producer.py'
      - '.github/workflows/ultrabert-retrieval-model.yml'
      - 'tests/test_ultrabert_retrieval.py'
