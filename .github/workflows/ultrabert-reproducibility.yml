name: UltraBERT original reproducibility
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ultrabert-original-reproducibility
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable original producer identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('tests/results/ultrabert/reference-audit.json').read_text())
          run = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + '${{ github.repository }}' + '/actions/runs/38997562520']))
          assert run['head_sha'] == record['source_commit'] and run['conclusion'] == 'success'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: heavy-38997562520
          run-id: 38997562520
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - run: |
          python -m pip install gguf==0.19.0 numpy==2.2.6 safetensors==0.8.0 huggingface-hub==1.33.0
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1
      - name: Compare original modules and frozen anchors across controlled backends
        run: python tools/ci-heavy/ultrabert_reproducibility.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/reproducibility.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-reproducibility-${{ github.run_id }}
          path: ${{ runner.temp }}/reproducibility.json
          retention-days: 90
          if-no-files-found: error
