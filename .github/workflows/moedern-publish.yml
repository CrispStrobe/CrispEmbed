name: MoEdern1.5M owner-approved publication
on:
  workflow_call:
    secrets:
      HF_PUBLISH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: moedern-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q huggingface-hub==1.33.0 numpy==2.2.6
      - name: Repack, verify proven bytes, upload with upstream notices, readback
        env:
          HF_TOKEN: ${{ secrets.HF_PUBLISH_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
        run: python tools/ci-heavy/moedern_publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moedern-publication-report-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
