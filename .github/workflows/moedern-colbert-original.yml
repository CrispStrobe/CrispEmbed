name: MoEdern ColBERT original CPU F32 preparation
on:
  workflow_call:
    inputs:
      variant:
        type: string
        default: '1.5M'
        required: false
      convert_after_original:
        type: boolean
        default: true
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: moedern-original-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      VARIANT: ${{ inputs.variant }}
      CONVERT: ${{ inputs.convert_after_original }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only identity, mapping and rejection controls
        run: python tests/test_moedern_colbert_contract.py -v
      - name: Authenticate retained original before framework installation or replay
        run: python tools/moedern-colbert/observer_continuity.py --prior "$RUNNER_TEMP/moedern-prior" --output "$RUNNER_TEMP/moedern-original/review"
      - name: Install pinned original CPU runtime on hosted runner
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 transformers==5.3.0 'sentence-transformers @ git+https://github.com/huggingface/sentence-transformers.git@b0bf39968ba461c34b29372144794eff1be06f6d' gguf==0.17.1
          python -m pip freeze > "$RUNNER_TEMP/moedern-requirements.txt"
      - name: Original first; optional conversion only after completed receipt
        shell: bash
        run: |
          args=(--variant "$VARIANT" --output "$RUNNER_TEMP/moedern-original" --prior-original "$RUNNER_TEMP/moedern-prior")
          if [[ "$CONVERT" == true ]]; then args+=(--convert-after-original); fi
          python tools/moedern-colbert/reference.py "${args[@]}"
      - name: Preserve exact source, checkpoint and raw original arrays remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moedern-original-raw-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/moedern-original/
            ${{ runner.temp }}/moedern-requirements.txt
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn
      - name: Small review even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moedern-original-review-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/moedern-original/review/
            ${{ runner.temp }}/moedern-original/*.conversion.json
            ${{ runner.temp }}/moedern-requirements.txt
          retention-days: 90
          if-no-files-found: warn
