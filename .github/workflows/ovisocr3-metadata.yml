name: OvisOCR3 original weight-free metadata
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only preflight before framework dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ovisocr3/out" "$RUNNER_TEMP/ovisocr3/scratch"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/ovisocr3/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/ovisocr3/scratch"
            echo "HF_HOME=$RUNNER_TEMP/ovisocr3/scratch/hf"
          } >> "$GITHUB_ENV"
          python tests/test_ovisocr3_export_profile.py -q
          python tests/test_ovisocr3_metadata.py -q
          python tools/ci-heavy/ovisocr3_metadata.py --preflight
      - name: Exact pinned CPU processor environment
        run: |
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 pillow==12.1.0 huggingface-hub==1.33.0
          python -m pip freeze > "$HEAVY_OUT/environment.txt"
      - name: Original source, generation, header, prompt and processor observations
        run: python tools/ci-heavy/ovisocr3_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-metadata-${{ github.run_id }}
          path: ${{ env.HEAVY_OUT }}/
          if-no-files-found: warn
          retention-days: 90
