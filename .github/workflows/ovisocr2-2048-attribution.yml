name: OvisOCR2 retained 2048 numerical attribution
on:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: ovisocr2-2048-attribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Immutable source and archive controls before model access
        run: |
          python tests/test_ovisocr2_2048_attribution.py -v
          python tools/ci-heavy/ovisocr2_2048_attribution.py --preflight
      - name: Frozen original CPU framework environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 gguf==0.19.0 safetensors==0.8.0 huggingface-hub==1.33.0 pillow==12.1.0
      - name: Trace retained stages and replay only original RMSNorm
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          python -m pip freeze > "$RUNNER_TEMP/out/environment.txt"
          HEAVY_OUT="$RUNNER_TEMP/out" HEAVY_SCRATCH="$RUNNER_TEMP/scratch" python tools/ci-heavy/ovisocr2_2048_attribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr2-2048-attribution-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr2-2048-attribution-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scratch/2048-attribution/operator/
          retention-days: 90
