name: LightOn4B retained preprocessing replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_ACCOUNT }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      GITHUB_ACTIONS: 'true'
      CRISPEMBED_BUILD_MODE: portable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle numpy pillow
      - name: Replay retained original input without models
        run: python tools/ci-heavy/lighton4b_preprocess_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton4b-preprocess-${{ github.run_id }}
          path: replay-report
          retention-days: 90
