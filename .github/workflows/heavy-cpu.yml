# Heavy CPU job - run one script from tools/ci-heavy/ on a GitHub-hosted runner.
#
# For the CPU work that used to go to Kaggle: Python reference dumps, parity
# diffs, ASR roundtrips, download -> convert -> quantize -> upload. Standard
# runners are free for public repos (Linux: 4 vCPU, 16 GB RAM, ~14 GB disk +
# the /mnt scratch disk, 6 h per job). Anything that needs a real GPU stays
# on Kaggle (see tools/kaggle/README.md).
#
# Contract for a script (tools/ci-heavy/README.md):
#   - $HEAVY_OUT      write results here; uploaded as the run's artifact
#   - $HEAVY_SCRATCH  big scratch dir (models, builds); not uploaded
#   - $HF_TOKEN       from the HF_TOKEN repository secret (may be empty)
#   - $HF_TOKEN_2     from the HF_TOKEN_2 secret: a write token, for scripts that
#                     upload (e.g. private research repos); may be empty
#   - optional $HEAVY_OUT/summary.md is appended to the job summary
#   - exit non-zero on a failed check, so the run shows red
#
# Run: Actions -> Heavy CPU job -> Run workflow, or
#   gh workflow run heavy-cpu.yml -f script=tools/ci-heavy/<name>.py [-f args=...]
# The exact extract_ocr_nov4_evidence.py selector uses a separate read-only job
# below: empty args/pip, ubuntu-latest and portable. It never enters the model job.
#
# Build mode: CMake builds default to `portable` (GGML_NATIVE=OFF and
# CRISPEMBED_NATIVE=OFF via $CRISPEMBED_BUILD_MODE), so precision receipts do not
# depend on the runner's CPU. Pass `-f build_mode=native` only for speed runs.
# The mode and CPU are written to $HEAVY_OUT/build-mode.txt.

name: Heavy CPU job

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script under tools/ci-heavy/ (e.g. tools/ci-heavy/qwen3vl_ref_ocr.py)'
        required: true
        type: string
      args:
        description: 'Arguments passed to the script (split on spaces)'
        required: false
        default: ''
        type: string
      pip:
        description: 'Extra pip packages before the run (space-separated; torch goes through the CPU index)'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
      isolated_lane:
        description: 'Optional unique lane for independent inputs and artifacts; empty serializes by script'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Script timeout in minutes (job hard limit is 360)'
        required: false
        default: '300'
        type: string
      build_mode:
        description: 'CPU build mode for CMake builds the script makes: portable (GGML_NATIVE=OFF, runner-independent; required for qualification/precision receipts) or native (-march=native; speed runs only)'
        required: false
        default: 'portable'
        type: choice
        options: [portable, native]

permissions:
  contents: read

# Serialize each script by default; independent immutable cases may opt into
# separate named lanes. Reuse the same lane for retries of the same case.
concurrency:
  group: heavy-cpu-${{ inputs.isolated_lane || inputs.script }}
  cancel-in-progress: false

jobs:
  run:
    if: inputs.script != 'tools/ci-heavy/extract_ocr_nov4_evidence.py' && inputs.script != 'tools/ci-heavy/extract_ocr_followup_evidence.py' && inputs.script != 'tools/ci-heavy/lighton3_pixtral_eps_ab.py' && inputs.script != 'tools/ci-heavy/preserve_ocr_nov4_archives.py' && inputs.script != 'tools/ci-heavy/lighton3_kv_f32_ab.py' && inputs.script != 'tools/ci-heavy/lighton3_kv_complete_first.py'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
      PIP_EXTRA: ${{ inputs.pip }}
      TIMEOUT_MIN: ${{ inputs.timeout_minutes }}
      # Read by CMakeLists.txt at configure time (explicit -DGGML_NATIVE wins).
      CRISPEMBED_BUILD_MODE: ${{ inputs.build_mode || 'portable' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Kaggle kernel outputs (e.g. original CUDA captures) for hosted CPU replays.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      KAGGLE_ACCOUNT: ${{ secrets.KAGGLE_ACCOUNT }}
      HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # ggml, for scripts that build the C++ side

      - name: Validate script path
        run: |
          case "$SCRIPT" in
            tools/ci-heavy/*.py|tools/ci-heavy/*.sh) ;;
            *) echo "::error::script must be a .py/.sh under tools/ci-heavy/ (got '$SCRIPT')"; exit 1 ;;
          esac
          case "$SCRIPT" in *..*) echo "::error::no '..' in script path"; exit 1 ;; esac
          [ -f "$SCRIPT" ] || { echo "::error::$SCRIPT not found at ${GITHUB_SHA::8}"; exit 1; }
          [[ "$TIMEOUT_MIN" =~ ^[0-9]+$ ]] || { echo "::error::timeout_minutes must be a number"; exit 1; }

      - name: Free disk and set up scratch (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h / /mnt 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          # /mnt is a separate, larger disk on the Linux x64 images; fall back to $RUNNER_TEMP.
          if sudo mkdir -p /mnt/heavy 2>/dev/null && sudo chown "$USER" /mnt/heavy; then S=/mnt/heavy; else S="$RUNNER_TEMP/heavy"; fi
          mkdir -p "$S/scratch" "$RUNNER_TEMP/out"
          echo "HEAVY_SCRATCH=$S/scratch" >> "$GITHUB_ENV"
          echo "HF_HOME=$S/scratch/hf" >> "$GITHUB_ENV"
          df -h / "$S" 2>/dev/null || true

      - name: Set up scratch (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/heavy/scratch" "$RUNNER_TEMP/out"
          echo "HEAVY_SCRATCH=$RUNNER_TEMP/heavy/scratch" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/heavy/scratch/hf" >> "$GITHUB_ENV"

      - name: Set output dir
        run: echo "HEAVY_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extra pip packages
        if: inputs.pip != ''
        run: |
          python -m pip install -q --upgrade pip
          read -ra pkgs <<< "$PIP_EXTRA"
          torch=(); rest=()
          for p in "${pkgs[@]}"; do case "$p" in torch|torch[=\<\>]*|torchvision*|torchaudio*) torch+=("$p");; *) rest+=("$p");; esac; done
          if [ ${#torch[@]} -gt 0 ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              python -m pip install -q "${torch[@]}" --index-url https://download.pytorch.org/whl/cpu
            else
              python -m pip install -q "${torch[@]}"
            fi
          fi
          [ ${#rest[@]} -eq 0 ] || python -m pip install -q "${rest[@]}"
          python -m pip list 2>/dev/null | grep -i -E "^(torch|transformers|numpy|onnx|huggingface)" || true

      - name: Run ${{ inputs.script }}
        run: |
          read -ra argv <<< "$ARGS"
          echo "runner: $RUNNER_OS/$RUNNER_ARCH  cpus: $(nproc 2>/dev/null || sysctl -n hw.ncpu)  commit: ${GITHUB_SHA::8}  build_mode: $CRISPEMBED_BUILD_MODE"
          # Every receipt states its build mode and the CPU it ran on.
          {
            echo "build_mode=$CRISPEMBED_BUILD_MODE"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            if [ -r /proc/cpuinfo ]; then
              echo "cpu=$(grep -m1 -E 'model name|^Model' /proc/cpuinfo | cut -d: -f2 | sed 's/^ //')"
              echo "cpu_avx512f=$(grep -m1 -qw avx512f /proc/cpuinfo && echo yes || echo no)"
            else
              echo "cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null)"
            fi
          } > "$HEAVY_OUT/build-mode.txt"
          case "$SCRIPT" in
            *.py) cmd=(python -u "$SCRIPT" "${argv[@]}") ;;
            *.sh) cmd=(bash "$SCRIPT" "${argv[@]}") ;;
          esac
          if command -v timeout >/dev/null; then
            timeout "${TIMEOUT_MIN}m" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f "$HEAVY_OUT/summary.md" ]; then cat "$HEAVY_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          du -sh "$HEAVY_OUT" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  ocr_evidence:
    if: inputs.script == 'tools/ci-heavy/extract_ocr_nov4_evidence.py'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set evidence directories on the allocated runner
        run: |
          echo "OCR_EVIDENCE_OUT=$RUNNER_TEMP/ocr-nov4-text" >> "$GITHUB_ENV"
          echo "OCR_EVIDENCE_SCRATCH=$RUNNER_TEMP/ocr-nov4-archive" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Closed source, archive security and original diagnostic controls
        run: python tests/test_extract_ocr_nov4_evidence.py -v
      - name: Verify two immutable archives and retain only bounded text
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_EVIDENCE_SCRIPT: ${{ inputs.script }}
          OCR_EVIDENCE_ARGS: ${{ inputs.args }}
          OCR_EVIDENCE_PIP: ${{ inputs.pip }}
          OCR_EVIDENCE_RUNNER: ${{ inputs.runner }}
          OCR_EVIDENCE_BUILD_MODE: ${{ inputs.build_mode }}
        run: python tools/ci-heavy/extract_ocr_nov4_evidence.py
      - name: Extraction summary
        if: always()
        run: |
          if [ -f "$OCR_EVIDENCE_OUT/summary.md" ]; then
            cat "$OCR_EVIDENCE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-nov4-retained-text-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-nov4-text/
          compression-level: 6
          retention-days: 90
          if-no-files-found: warn

  ocr_followup_evidence:
    if: inputs.script == 'tools/ci-heavy/extract_ocr_followup_evidence.py'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set evidence directories on the allocated runner
        run: |
          echo "OCR_EVIDENCE_OUT=$RUNNER_TEMP/ocr-followup-text" >> "$GITHUB_ENV"
          echo "OCR_EVIDENCE_SCRATCH=$RUNNER_TEMP/ocr-followup-archive" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Closed source, archive security and original diagnostic controls
        run: python tests/test_extract_ocr_followup_evidence.py -v
      - name: Verify pinned follow-up archives and retain only bounded text
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_EVIDENCE_SCRIPT: ${{ inputs.script }}
          OCR_EVIDENCE_ARGS: ${{ inputs.args }}
          OCR_EVIDENCE_PIP: ${{ inputs.pip }}
          OCR_EVIDENCE_RUNNER: ${{ inputs.runner }}
          OCR_EVIDENCE_BUILD_MODE: ${{ inputs.build_mode }}
        run: python tools/ci-heavy/extract_ocr_followup_evidence.py
      - name: Extraction summary
        if: always()
        run: |
          if [ -f "$OCR_EVIDENCE_OUT/summary.md" ]; then
            cat "$OCR_EVIDENCE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-followup-retained-text-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-followup-text/
          compression-level: 6
          retention-days: 90
          if-no-files-found: warn

  lighton_eps_ab:
    if: inputs.script == 'tools/ci-heavy/lighton3_pixtral_eps_ab.py'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fetch the exact retained baseline for the source delta guard
        run: git fetch --no-tags --depth=1 origin 4476be6eb21ecacc3c001ed4e02928d0a98be0ea
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded A/B source and archive controls
        run: |
          python tests/test_extract_ocr_nov4_evidence.py
          python tests/test_lighton3_pixtral_eps_ab.py
          python tests/test_validate_lighton3_eps_first.py
      - name: Prepare disposable hosted scratch and isolated Python
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "EPS_OUT=$RUNNER_TEMP/lighton3-eps-out" >> "$GITHUB_ENV"
          echo "EPS_SCRATCH=$RUNNER_TEMP/lighton3-eps-scratch" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/lighton3-eps-python"
      - name: Retained original, exact legacy replay, source epsilon A/B
        env:
          GH_TOKEN: ${{ github.token }}
          EPS_SELECTED_SCRIPT: ${{ inputs.script }}
          EPS_SELECTED_RUNNER: ${{ inputs.runner }}
          EPS_SELECTED_MODE: ${{ inputs.build_mode }}
          EPS_SELECTED_PIP: ${{ inputs.pip }}
          EPS_ARGUMENTS: ${{ inputs.args }}
        run: |
          read -ra arguments <<< "$EPS_ARGUMENTS"
          "$RUNNER_TEMP/lighton3-eps-python/bin/python" tools/ci-heavy/validate_lighton3_eps_first.py "${arguments[@]}"
          "$RUNNER_TEMP/lighton3-eps-python/bin/python" -u tools/ci-heavy/lighton3_pixtral_eps_ab.py "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-eps-review-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-eps-out/review/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-eps-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-eps-out/raw/
          retention-days: 90

  ocr_raw_preservation:
    if: inputs.script == 'tools/ci-heavy/preserve_ocr_nov4_archives.py'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      PRESERVE_SELECTED_SCRIPT: ${{ inputs.script }}
      PRESERVE_SELECTED_RUNNER: ${{ inputs.runner }}
      PRESERVE_SELECTED_MODE: ${{ inputs.build_mode }}
      PRESERVE_SELECTED_PIP: ${{ inputs.pip }}
      PRESERVE_SELECTED_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preservation provenance, streaming and readback controls
        run: python tests/test_preserve_ocr_nov4_archives.py -v
      - name: Prepare disposable hosted archive capacity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "PRESERVE_OUT=$RUNNER_TEMP/ocr-nov4-preserved" >> "$GITHUB_ENV"
          echo "PRESERVE_SCRATCH=$RUNNER_TEMP/ocr-nov4-readback" >> "$GITHUB_ENV"
      - name: Authenticate and copy original ZIP bytes without model calls
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra batch_arguments <<< "$PRESERVE_SELECTED_ARGS"
          python -u tools/ci-heavy/preserve_ocr_nov4_archives.py "${batch_arguments[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        id: originals
        with:
          name: ocr-nov4-original-zips-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-nov4-preserved/raw/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - name: Read back uploaded archive and rehash every original ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PRESERVE_ARTIFACT: ${{ steps.originals.outputs.artifact-id }}
        run: |
          read -ra batch_arguments <<< "$PRESERVE_SELECTED_ARGS"
          python -u tools/ci-heavy/preserve_ocr_nov4_archives.py "${batch_arguments[@]}" --verify-artifact "$PRESERVE_ARTIFACT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-nov4-preservation-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-nov4-preserved/review/
          retention-days: 90
          if-no-files-found: warn

  lighton_kv_ab:
    if: inputs.script == 'tools/ci-heavy/lighton3_kv_f32_ab.py'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      KV_SELECTED_SCRIPT: ${{ inputs.script }}
      KV_SELECTED_RUNNER: ${{ inputs.runner }}
      KV_SELECTED_MODE: ${{ inputs.build_mode }}
      KV_SELECTED_PIP: ${{ inputs.pip }}
      KV_SELECTED_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fetch exact retained cache baseline for the source delta guard
        run: git fetch --no-tags --depth=1 origin 0473dd5e813fdf48d2bafbd16811271cf6c42599
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Current source, closed selection and prefill byte controls
        run: python tests/test_lighton3_kv_f32_ab.py -v
      - name: Prepare disposable hosted scratch and isolated Python
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "KV_OUT=$RUNNER_TEMP/lighton3-kv-out" >> "$GITHUB_ENV"
          echo "KV_SCRATCH=$RUNNER_TEMP/lighton3-kv-scratch" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/lighton3-kv-python"
      - name: Retained form, legacy cache replay and CPU F32 cache A/B
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/lighton3-kv-python/bin/python" -u tools/ci-heavy/lighton3_kv_f32_ab.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-kv-review-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-kv-out/review/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-kv-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-kv-out/raw/
          retention-days: 90
          if-no-files-found: warn

  lighton_kv_completion:
    if: inputs.script == 'tools/ci-heavy/lighton3_kv_complete_first.py'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      COMPLETE_SELECTED_SCRIPT: ${{ inputs.script }}
      COMPLETE_SELECTED_RUNNER: ${{ inputs.runner }}
      COMPLETE_SELECTED_MODE: ${{ inputs.build_mode }}
      COMPLETE_SELECTED_PIP: ${{ inputs.pip }}
      COMPLETE_SELECTED_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Operator/native source, exact retained failure and prefill classification controls
        run: python tests/test_lighton3_kv_complete_first.py -v
      - name: Preserve the committed operator and check out the original native source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir "$RUNNER_TEMP/lighton3-kv-completion"
          cp tools/ci-heavy/lighton3_kv_complete_first.py "$RUNNER_TEMP/lighton3-kv-completion/driver.py"
          cp docs/lighton3-kv-complete-first-v1.json "$RUNNER_TEMP/lighton3-kv-completion/protocol.json"
          git fetch --no-tags --depth=1 origin 3e82a12058cfca8869f4aa8ead250acf2b708934
          git checkout --detach 3e82a12058cfca8869f4aa8ead250acf2b708934
      - name: Prepare disposable hosted scratch with the original build path
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          {
            echo "KV_OUT=$RUNNER_TEMP/lighton3-kv-out"
            echo "KV_SCRATCH=$RUNNER_TEMP/lighton3-kv-scratch"
            echo "COMPLETE_PROTOCOL=$RUNNER_TEMP/lighton3-kv-completion/protocol.json"
          } >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/lighton3-kv-python"
      - name: Reuse ten native results; reproduce exact binary; run only two missing calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/lighton3-kv-python/bin/python" -u "$RUNNER_TEMP/lighton3-kv-completion/driver.py"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-kv-completion-review-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-kv-out/review/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighton3-kv-completion-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/lighton3-kv-out/raw/
          retention-days: 90
          if-no-files-found: warn
