name: Josev authenticated F32 packing and packed-runtime qualification
on:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: josev-packed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packed:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Tiny stdlib parser, repack and worker controls before payloads
        run: |
          python tests/test_josev2b_packed_f32.py -v
          python tests/test_josev2b_packed_worker.py -v
      - name: Pin independent numerical comparison only
        run: python -m pip install numpy==2.2.6
      - name: Build pinned runtime, authenticate components, pack and compare all four requests
        run: python tools/ci-heavy/josev2b_packed.py --output "$RUNNER_TEMP/josev-packed-output" --scratch "$RUNNER_TEMP/josev-packed-scratch"
      - name: Preserve small reports, logs and every rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: josev-packed-review-${{ github.run_id }}
          path: ${{ runner.temp }}/josev-packed-output/review/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve packed file and exact original source notices remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: josev-packed-f32-asset-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/josev-packed-output/raw/josev2b-systemone-f32.gguf
            ${{ runner.temp }}/josev-packed-output/raw/josev2b-systemone-f32.gguf.partial
            ${{ runner.temp }}/josev-packed-output/raw/notices/
            ${{ runner.temp }}/josev-packed-output/review/repack.json
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve all native raw arrays and comparisons remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: josev-packed-traces-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/josev-packed-output/raw/plain/
            ${{ runner.temp }}/josev-packed-output/raw/observed/
            ${{ runner.temp }}/josev-packed-output/raw/repeat/
            ${{ runner.temp }}/josev-packed-output/raw/comparison/
            ${{ runner.temp }}/josev-packed-output/raw/requests.json
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn
