name: Publish crispembed to pub.dev
on:
  push:
    tags: ['crispembed-v[0-9]+.[0-9]+.[0-9]+']
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # the 0.16.0 run hung ~6h in the publish step; fail fast instead
    environment: pub.dev
    permissions:
      id-token: write  # OIDC auth to pub.dev (no stored secrets)
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Publish
        working-directory: flutter/crispembed
        timeout-minutes: 10  # publish itself should take <2 min; bound it so a hang surfaces
        run: |
          flutter pub get
          flutter pub publish --force
