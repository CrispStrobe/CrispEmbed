name: Frozen real-scan RGB input audit v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocr-rgb-input-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONNOUSERSITE: '1'
      PIP_CONFIG_FILE: /dev/null
      PIP_USER: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Resource admission before packages or encoded inputs
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          ram=int(next(r.split()[1] for r in Path('/proc/meminfo').read_text().splitlines() if r.startswith('MemAvailable:')))*1024
          assert ram>=4*2**30 and shutil.disk_usage('.').free>=3*2**30 and os.cpu_count()>=2
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and stdlib controls, no decoder packages or images
        run: |
          python tools/ocr-rgb-input/contract.py > "$RUNNER_TEMP/rgb-input-source.json"
          python tests/test_ocr_rgb_input.py -v
      - name: Pinned codec/input packages, no model framework
        run: |
          python -m venv "$RUNNER_TEMP/rgb-input-venv"
          "$RUNNER_TEMP/rgb-input-venv/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r tools/ocr-rgb-input/requirements.lock
          "$RUNNER_TEMP/rgb-input-venv/bin/python" -m pip check
      - name: Tiny production STB build, authenticate all20, decode and compare RGB
        env:
          SOURCE_REF: ${{ github.sha }}
        run: '"$RUNNER_TEMP/rgb-input-venv/bin/python" -I tools/ocr-rgb-input/audit.py --source "$SOURCE_REF" --scratch "$RUNNER_TEMP/rgb-input-scratch" --out "$RUNNER_TEMP/rgb-input-out"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-rgb-input-v1-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rgb-input-source.json
            ${{ runner.temp }}/rgb-input-out/review/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-rgb-input-v1-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/rgb-input-out/raw/
          retention-days: 90
          if-no-files-found: warn
