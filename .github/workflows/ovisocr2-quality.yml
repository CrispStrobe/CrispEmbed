name: OvisOCR2 bounded original and native OCR quality
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: 'Reviewed native baseline required; Q4 additionally requires reviewed Q8'
        options: [original, f16, q8, q4]
        default: original
permissions:
  contents: read
concurrency:
  group: ovisocr2-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reviewed baseline, panel, and source proof before dependencies
        env:
          QUALITY_PHASE: ${{ inputs.phase }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          echo "HEAVY_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "HEAVY_SCRATCH=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/scratch/hf" >> "$GITHUB_ENV"
          HEAVY_OUT="$RUNNER_TEMP/out" HEAVY_SCRATCH="$RUNNER_TEMP/scratch" python tools/ci-heavy/ovisocr2_quality_run.py --phase "$QUALITY_PHASE" --preflight
      - name: Reproduce previously reviewed realistic documents before model outputs
        env:
          QUALITY_PHASE: ${{ inputs.phase }}
        run: |
          python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
          python tools/ci-heavy/ovisocr2_quality_run.py --phase "$QUALITY_PHASE" --prepare-documents
      - name: Pinned original HF CPU stack
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 pillow==12.1.0 huggingface-hub==1.33.0 gguf==0.19.0 safetensors==0.8.0
          python -m pip freeze > "$HEAVY_OUT/environment.txt"
      - name: Frozen original and selected experimental quality arm
        env:
          QUALITY_PHASE: ${{ inputs.phase }}
        run: python tools/ci-heavy/ovisocr2_quality_run.py --phase "$QUALITY_PHASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr2-quality-reports-${{ github.run_id }}
          path: ${{ env.HEAVY_OUT }}/
          if-no-files-found: warn
          retention-days: 90
