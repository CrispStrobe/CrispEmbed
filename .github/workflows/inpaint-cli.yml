name: Inpainting CLI and image contracts

# Use the same complete diff on PRs and main pushes. Ordinary feature pushes
# are validated by their PR, avoiding a second copy of each platform matrix.
on:
  pull_request:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  push:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  workflow_dispatch:
    inputs:
      model_smoke:
        description: 'Reproduce the exact reviewed 25 MB model and run synthetic real-inference smoke on Linux'
        type: boolean
        default: false

permissions:
  contents: read

# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  changes:
    name: Select necessary CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_windows: ${{ steps.select.outputs.native_windows }}
      native_macos: ${{ steps.select.outputs.native_macos }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      desktop: ${{ steps.select.outputs.desktop }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select

  contracts:
    needs: changes
    if: needs.changes.outputs.inpaint_python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model preparation and independent PNG controls
        run: |
          python tests/test_prepare_migan_inpaint.py -v
          python tests/test_inpaint_png.py -v
          python tests/test_inpaint_engine_live_controls.py -v
          python tests/test_migan_reference_contract.py -v
          python tests/test_migan_native_driver.py -v
          python tests/test_migan512_contract.py -v
          python tests/test_latent_inpaint_contract.py -v
          python tests/test_latent_inpaint_original_import.py -v
          python tests/test_inpaint_gguf_publish.py -v
          python tests/test_inpaint_video_quality.py -v
      - name: Fetch native dependencies only for native changes
        if: needs.changes.outputs.inpaint_native == 'true'
        run: git submodule update --init --recursive
      - uses: ./.github/actions/compiler-cache
        if: needs.changes.outputs.inpaint_native == 'true'
        with:
          namespace: inpaint-release-portable-cpu
      - name: Configure portable CPU build
        if: needs.changes.outputs.inpaint_native == 'true'
        run: >-
          cmake -S . -B build-inpaint -DCMAKE_BUILD_TYPE=Release
          -DGGML_NATIVE=OFF -DCRISPEMBED_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          -DGGML_BLAS=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF
          -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DCRISPEMBED_BUILD_SHARED=OFF
      - name: Build the small temporal and CLI driver targets first
        if: needs.changes.outputs.inpaint_native == 'true'
        run: >-
          cmake --build build-inpaint --config Release --parallel 2
          --target test-inpaint-temporal test-inpaint-cli-driver
      - name: Fast temporal, stream and synthetic video controls
        if: needs.changes.outputs.inpaint_native == 'true'
        run: |
          bin=build-inpaint
          suffix=
          if [ -f build-inpaint/Release/test-inpaint-temporal.exe ]; then
            bin=build-inpaint/Release
            suffix=.exe
          fi
          "$bin/test-inpaint-temporal$suffix"
          python tests/test_inpaint_cli.py --binary "$bin/test-inpaint-cli-driver$suffix" -v
          python tests/inpaint_video_quality.py --binary "$bin/test-inpaint-cli-driver$suffix" \
            --fake-engine --output-dir "$RUNNER_TEMP/inpaint-video-synthetic"
      - name: Retain synthetic video regression reports
        if: always() && needs.changes.outputs.inpaint_native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inpaint-video-synthetic-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/inpaint-video-synthetic/
          if-no-files-found: warn
          retention-days: 30
      - name: Build production CLI and remaining image contracts
        if: needs.changes.outputs.inpaint_native == 'true'
        run: >-
          cmake --build build-inpaint --config Release --parallel 2
          --target crispembed-cli test-inpaint test-migan-diff test-migan512-diff
          test-latent-inpaint-attention test-latent-inpaint-pipeline test-latent-inpaint
          test-latent-inpaint-ops
      - name: Native contracts and production CLI routing
        if: needs.changes.outputs.inpaint_native == 'true'
        run: |
          bin=build-inpaint
          suffix=
          if [ -f build-inpaint/Release/crispembed.exe ]; then
            bin=build-inpaint/Release
            suffix=.exe
          fi
          "$bin/test-inpaint$suffix"
          "$bin/test-migan-diff$suffix" --contracts
          "$bin/test-migan-diff$suffix" --gate-controls
          "$bin/test-migan-diff$suffix" --observer-retention
          "$bin/test-migan512-diff$suffix" --contracts
          "$bin/test-migan512-diff$suffix" --gate-controls
          "$bin/test-migan512-diff$suffix" --observer-retention
          "$bin/test-latent-inpaint-attention$suffix"
          "$bin/test-latent-inpaint-pipeline$suffix"
          "$bin/test-latent-inpaint-ops$suffix"
          "$bin/test-latent-inpaint$suffix" --contracts
          python tests/test_inpaint_cli.py --binary "$bin/test-inpaint-cli-driver$suffix" \
            --real-binary "$bin/crispembed$suffix" -k test_real_binary -v
      - name: Reproduce the reviewed model without framework dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.model_smoke && matrix.os == 'ubuntu-24.04'
        run: python tools/prepare_migan_inpaint.py --download --output-dir "$RUNNER_TEMP/migan-inpaint-model"
      - name: Production CLI synthetic model smoke
        if: github.event_name == 'workflow_dispatch' && inputs.model_smoke && matrix.os == 'ubuntu-24.04'
        run: >-
          python tests/test_inpaint_model.py --binary build-inpaint/crispembed
          --model "$RUNNER_TEMP/migan-inpaint-model/migan-256-places2-f32-experimental.gguf"
          --output-dir "$RUNNER_TEMP/inpaint-model-smoke"
      - name: Retain synthetic smoke evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.model_smoke && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: inpaint-cli-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/inpaint-model-smoke/
            ${{ runner.temp }}/migan-inpaint-model/replication.json
            ${{ runner.temp }}/migan-inpaint-model/licenses/
          if-no-files-found: warn
          retention-days: 30

  result:
    name: Inpainting result
    if: always()
    needs: [changes, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector changes
          contracts=inpaint_python
