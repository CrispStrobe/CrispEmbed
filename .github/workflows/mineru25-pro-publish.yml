name: MinerU2.5-Pro GGUF publication (owner-approved only)
# Converts opendatalab/MinerU2.5-Pro-2604-1.2B (Apache-2.0) at the revision pinned in
# models/mineru25-pro-source.json, quantizes with crispembed-quantize (only variants whose
# committed precision receipt is token-ID exact on every case), and uploads to the destination
# in docs/mineru25-pro-publication-v1.json with the verbatim Apache-2.0 LICENSE, the upstream
# card, a statement of changes and a manifest.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact commit containing the converter, quantizer, protocol and receipts'
        required: true
        type: string
      variants:
        description: 'Comma-separated precisions from the protocol recipes (F32,F16,Q8_0,Q4_K)'
        required: true
        default: 'F16'
        type: string
permissions:
  contents: read
concurrency:
  group: mineru25-pro-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish-script controls (no network)
        run: python tests/test_mineru25_publish.py -v
      - name: Protocol, receipts and build plan before any download or credential
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          python tools/ci-heavy/mineru25_publish.py plan "$VARIANTS" | tee "$RUNNER_TEMP/plan.txt"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Pinned conversion and publication clients
        run: python -m pip install -q -r tools/mineru25-conversion-requirements.txt
      - name: Work area on the large runner disk
        run: |
          sudo mkdir -p /mnt/mineru && sudo chown "$USER" /mnt/mineru
          mkdir -p /mnt/mineru/src /mnt/mineru/gguf /mnt/mineru/notices /mnt/mineru/scratch "$RUNNER_TEMP/out"
          df -h / /mnt
      - name: Upstream LICENSE and model card (pinned, hash-checked)
        run: python tools/ci-heavy/mineru25_publish.py notices /mnt/mineru/notices
      - name: Pinned upstream checkpoint
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import snapshot_download
          c = json.load(open('models/mineru25-pro-source.json'))
          snapshot_download(c['repository'], revision=c['revision'], local_dir='/mnt/mineru/src', token=False)
          PY
      - name: Build crispembed-quantize
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DCRISPEMBED_NATIVE=OFF -DGGML_CUDA=OFF
          cmake --build build --target crispembed-quantize --parallel 4
      - name: Convert (converter re-verifies every pinned source hash) and quantize per plan
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          TMPDIR: /mnt/mineru/scratch
        run: |
          set -euo pipefail
          q=$(find build -type f -name crispembed-quantize -perm -u+x | head -1)
          f32=/mnt/mineru/gguf/$(python -c "import json;print(json.load(open('docs/mineru25-pro-publication-v1.json'))['recipes']['F32']['filename'])")
          while read -r kind variant name rest; do
            case "$kind" in
              convert)
                python models/convert-mineru25-pro-to-gguf.py --model /mnt/mineru/src --output "/mnt/mineru/gguf/$name" $rest
                mv "/mnt/mineru/gguf/$name.json" "$RUNNER_TEMP/out/$name.conversion.json" 2>/dev/null || true ;;
              quantize)
                rm -rf /mnt/mineru/src
                "$q" "$f32" "/mnt/mineru/gguf/$name" $rest ;;
              drop-f32) rm -f "$f32" ;;
            esac
          done < "$RUNNER_TEMP/plan.txt"
          rm -rf /mnt/mineru/src
          ls -l /mnt/mineru/gguf; df -h /mnt
      - name: Upload, immutable LFS identity, empty-cache readback
        env:
          HF_TOKEN: ${{ secrets.HF_PUBLISH_TOKEN }}
          HF_HUB_DISABLE_XET: '1'
          HEAVY_SCRATCH: /mnt/mineru/scratch
          VARIANTS: ${{ inputs.variants }}
        run: |
          python tools/ci-heavy/mineru25_publish.py publish "$VARIANTS" /mnt/mineru/gguf /mnt/mineru/notices "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mineru25-pro-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 90
