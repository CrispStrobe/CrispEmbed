name: OCR quality contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-quality.yml'
      - 'tools/ocr_quality.py'
      - 'tools/ci-heavy/ocr_quality_prepare.py'
      - 'tools/ci-heavy/qwen35_quality.py'
      - 'tools/ci-heavy/qwen35_ocr_bootstrap.py'
      - 'tests/test_qwen35_quality.py'
      - 'tests/test_qwen35_book_isolation.py'
      - 'tools/ci-heavy/qwen35_book_isolation.py'
      - 'tools/ci-heavy/qwen35_book_vision.py'
      - 'tests/test_qwen35_book_vision.py'
      - 'tools/ci-heavy/qwen35_quality_quant.py'
      - 'tests/test_qwen35_quality_quant.py'
      - 'tools/audit_qwen35_quality_quant.py'
      - 'tests/test_qwen35_quality_audit.py'
      - 'tests/results/qwen35-ocr/quality-quant-*-inventory-table.json'
      - 'tools/qwen35_decode_reference.py'
      - 'tools/dump_qwen35_ocr_page_reference.py'
      - 'tests/test_qwen35_quant.cpp'
      - 'tests/results/ocr-quality-prepared.json'
      - 'tests/test_ocr_quality.py'
      - 'tests/regression/ocr-quality/**'
      - 'tools/ci-heavy/qwen35_quant_calibration.py'
      - 'tests/regression/images/cc0/ground_truth.json'
      - 'tests/regression/images/cc0/receipt_historical.*'
      - 'tests/regression/images/cc0/commons_test_ocr_document.jpg'
      - 'tests/results/qwen35-ocr/page-parity.json'
      - 'tests/results/qwen35-ocr/receipt.json'
      - 'tests/results/qwen35-ocr/ffn-calibration-parity.json'
      # Sources pinned by the frozen quantization receipts: drift is caught when it
      # happens and must be recorded with tools/qwen35_source_pins.py --amend.
      - 'tools/qwen35_source_pins.py'
      - 'tests/results/qwen35-ocr/source-pin-amendments.json'
      - 'src/qwen35_math.h'
      - 'src/qwen35_linear.cpp'
      - 'src/qwen35_ocr.cpp'
      - 'src/qwen35_vision.cpp'
      - 'src/qwen35_norm.cpp'
      - 'src/qwen35_profile.cpp'
      - 'src/qwen35_profile.h'
      - 'tests/qwen35_parity.h'
      - 'tools/quantize.cpp'
  pull_request:
    paths:
      - '.github/workflows/ocr-quality.yml'
      - 'tools/ocr_quality.py'
      - 'tools/ci-heavy/ocr_quality_prepare.py'
      - 'tools/ci-heavy/qwen35_quality.py'
      - 'tools/ci-heavy/qwen35_ocr_bootstrap.py'
      - 'tests/test_qwen35_quality.py'
      - 'tests/test_qwen35_book_isolation.py'
      - 'tools/ci-heavy/qwen35_book_isolation.py'
      - 'tools/ci-heavy/qwen35_book_vision.py'
      - 'tests/test_qwen35_book_vision.py'
      - 'tools/ci-heavy/qwen35_quality_quant.py'
      - 'tests/test_qwen35_quality_quant.py'
      - 'tools/audit_qwen35_quality_quant.py'
      - 'tests/test_qwen35_quality_audit.py'
      - 'tests/results/qwen35-ocr/quality-quant-*-inventory-table.json'
      - 'tools/qwen35_decode_reference.py'
      - 'tools/dump_qwen35_ocr_page_reference.py'
      - 'tests/test_qwen35_quant.cpp'
      - 'tests/results/ocr-quality-prepared.json'
      - 'tests/test_ocr_quality.py'
      - 'tests/regression/ocr-quality/**'
      - 'tools/ci-heavy/qwen35_quant_calibration.py'
      - 'tests/regression/images/cc0/ground_truth.json'
      - 'tests/regression/images/cc0/receipt_historical.*'
      - 'tests/regression/images/cc0/commons_test_ocr_document.jpg'
      - 'tests/results/qwen35-ocr/page-parity.json'
      - 'tests/results/qwen35-ocr/receipt.json'
      - 'tests/results/qwen35-ocr/ffn-calibration-parity.json'
      # Sources pinned by the frozen quantization receipts: drift is caught when it
      # happens and must be recorded with tools/qwen35_source_pins.py --amend.
      - 'tools/qwen35_source_pins.py'
      - 'tests/results/qwen35-ocr/source-pin-amendments.json'
      - 'src/qwen35_math.h'
      - 'src/qwen35_linear.cpp'
      - 'src/qwen35_ocr.cpp'
      - 'src/qwen35_vision.cpp'
      - 'src/qwen35_norm.cpp'
      - 'src/qwen35_profile.cpp'
      - 'src/qwen35_profile.h'
      - 'tests/qwen35_parity.h'
      - 'tools/quantize.cpp'
permissions:
  contents: read
# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: ocr-quality-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the receipt commits the frozen source pins came from
        run: |
          commits=$(python3 -c "import json; print(' '.join(sorted({json.load(open(f))['source_commit'] for f in ['tests/results/qwen35-ocr/quality-quant-%s-inventory-table.json' % p for p in ('q8', 'q8-q6', 'q4')]})))")
          git fetch --no-tags --depth=1 origin $commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_ocr_quality.py -v
      - run: python tests/test_qwen35_quality.py -v
      - run: python tests/test_qwen35_book_isolation.py -v
      - run: python tests/test_qwen35_book_vision.py -v
      - run: python tests/test_qwen35_quality_quant.py -v
      - run: python tests/test_qwen35_quality_audit.py -v
        env:
          OCR_PIN_REQUIRE_GIT: '1'
      - run: python tools/qwen35_source_pins.py --check --verify-git
      - run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Prepare held-out derivatives without model inference
        env:
          HEAVY_OUT: ${{ runner.temp }}/ocr-quality
        run: python tools/ci-heavy/ocr_quality_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-quality-contract
          path: ${{ runner.temp }}/ocr-quality/
          if-no-files-found: error
          retention-days: 30
