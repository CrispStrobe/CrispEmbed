name: Build WASM (text embeddings)

# Builds the CrispEmbed text-embedding WASM module and uploads as artifact.
# Triggered on changes to the WASM-relevant sources.

# Push and PR use the same dependency map (tools/ci_selection.py). Pure
# docs/evidence changes start no run (the paths filter below; main has no
# required checks). Every other change runs the cheap selector, the jobs it
# selects, and an always-run result check that rejects unexpected skips.
on:
  push:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  pull_request:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

# A docs-only main push selects no build and must not cancel the previous
# code-bearing push. PR diffs are cumulative, so superseded PR runs can cancel.
concurrency:
  group: build-wasm-embed-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select necessary CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_windows: ${{ steps.select.outputs.native_windows }}
      native_macos: ${{ steps.select.outputs.native_macos }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      desktop: ${{ steps.select.outputs.desktop }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select

  build:
    needs: changes
    if: needs.changes.outputs.wasm_embed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64'

      - name: Build WASM embed module
        run: ./build-embed-wasm.sh --no-simd

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crispembed-embed-wasm
          path: |
            build-embed-wasm/crispembed_embed.js
            build-embed-wasm/crispembed_embed.wasm
          retention-days: 30

  result:
    name: Embedding WASM result
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector changes
          build=wasm_embed
