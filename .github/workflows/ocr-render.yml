name: OCR export artifacts

on:
  push:
    branches: [main, feat/ocr-reviewed-pdf-conformance, feat/ocr-reviewed-pdf-readers]
    paths:
      - 'src/ocr_render.*'
      - 'src/ocr_pdf_font.h'
      - 'src/ocr_pdf_metrics.h'
      - 'src/ocr_pdf_srgb.h'
      - 'vendor/sheenbidi/**'
      - 'tests/*ocr_render*'
      - 'tests/check_ocr_pdfa.py'
      - 'tools/generate_ocr_font.py'
      - 'tools/generate_ocr_srgb.py'
      - 'tools/install_ocr_verapdf.py'
      - 'CMakeLists.txt'
      - '.github/workflows/ocr-render.yml'
  pull_request:
    paths:
      - 'src/ocr_render.*'
      - 'src/ocr_pdf_font.h'
      - 'src/ocr_pdf_metrics.h'
      - 'src/ocr_pdf_srgb.h'
      - 'vendor/sheenbidi/**'
      - 'tests/*ocr_render*'
      - 'tests/check_ocr_pdfa.py'
      - 'tools/generate_ocr_font.py'
      - 'tools/generate_ocr_srgb.py'
      - 'tools/install_ocr_verapdf.py'
      - 'CMakeLists.txt'
      - '.github/workflows/ocr-render.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install independent readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install 'Pillow==13.0.0' 'pypdf==6.21.4' 'PyMuPDF==1.26.6' 'pypdfium2==5.15.1' 'fonttools==4.68.0'
      - name: Install pinned independent PDF/A validator
        run: python tools/install_ocr_verapdf.py --prefix build-ocr-render/verapdf
      - name: Build model-free native renderer
        id: native
        run: |
          mkdir -p build-ocr-render/artifacts
          cc -std=c11 -O1 -fPIC -DSB_CONFIG_UNITY \
            -Ivendor/sheenbidi/Headers -Ivendor/sheenbidi/Source \
            -c vendor/sheenbidi/Source/SheenBidi.c -o build-ocr-render/sheenbidi.o
          c++ -std=c++17 -O1 -fPIC -shared -DCRISPEMBED_BUILD \
            '-DCRISPEMBED_VERSION_STR="0.17.16"' -Isrc -Ivendor/sheenbidi/Headers \
            src/ocr_render.cpp tests/ocr_render_stb.cpp build-ocr-render/sheenbidi.o \
            -o build-ocr-render/libocr_render_test.so
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/test_ocr_render.cpp -Lbuild-ocr-render -locr_render_test \
            -Wl,-rpath,'$ORIGIN' -o build-ocr-render/test-ocr-render
          git rev-parse HEAD > build-ocr-render/artifacts/source.txt
      - name: Validate PDF, image, text and XML artifacts
        run: |
          ./build-ocr-render/test-ocr-render
          python tests/test_ocr_render_artifacts.py \
            --library build-ocr-render/libocr_render_test.so \
            --artifacts build-ocr-render/artifacts -v
      - name: Validate declared PDF/A-2b and reject damaged controls
        if: always() && steps.native.outcome == 'success'
        run: |
          python tests/check_ocr_pdfa.py --verapdf build-ocr-render/verapdf/verapdf \
            --artifacts build-ocr-render/artifacts
      - name: Preserve exported files and validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-export-artifacts
          path: build-ocr-render/artifacts
          if-no-files-found: error
          retention-days: 7
