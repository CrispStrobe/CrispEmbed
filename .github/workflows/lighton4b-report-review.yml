name: LightOn4B retained report review
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve exact retained component artifact
        uses: actions/download-artifact@v4
        with:
          name: lighton4b-components-41923599391
          run-id: 41923599391
          github-token: ${{ github.token }}
          path: retained
      - name: Retain only small reports
        run: |
          mkdir review
          cp retained/gdn/component-report.json review/
          cp retained/meta/export-meta.json review/
          cp retained/environment/pip-check.txt review/
          cp retained/environment/installed.txt review/
          cp retained/environment/resolution.json review/
          sha256sum review/* > review/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lighton4b-small-report-review
          path: review/
          if-no-files-found: error
          retention-days: 90
