name: OvisOCR3 qualified F16 GGUF publication

on:
  workflow_call:
    inputs:
      model_run_id:
        required: true
        type: string
    secrets:
      HF_OVISOCR3_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      model_run_id:
        description: 'Independently reviewed fourteen-arm native run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ovisocr3-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_ovisocr3_publish.py -v

  publish:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL_RUN_ID: ${{ inputs.model_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently reviewed GPU, original, native, F16 and public gate before auth or weights
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          echo "HEAVY_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "HEAVY_SCRATCH=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
          HEAVY_OUT="$RUNNER_TEMP/out" HEAVY_SCRATCH="$RUNNER_TEMP/scratch" \
            python tools/ci-heavy/ovisocr3_publish.py --preflight --model-run-id "$MODEL_RUN_ID"
      - name: Dedicated publication credential exists before artifact transfer
        env:
          HF_OVISOCR3_WRITER: ${{ secrets.HF_OVISOCR3_PUBLISH_TOKEN }}
        run: |
          if [ -z "$HF_OVISOCR3_WRITER" ]; then
            echo "::error::Dedicated OvisOCR3 publication credential is unavailable."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ovisocr3-native14-f16-${{ inputs.model_run_id }}
          run-id: ${{ inputs.model_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-f16
      - name: Pinned publication client after qualification
        run: python -m pip install huggingface-hub==1.33.0
      - name: Publish exact reviewed F16 and verify immutable empty-cache download
        env:
          HF_TOKEN: ${{ secrets.HF_OVISOCR3_PUBLISH_TOKEN }}
          HF_HOME: ${{ runner.temp }}/scratch/ovisocr3-publish/fresh-hf-home
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tools/ci-heavy/ovisocr3_publish.py --model-run-id "$MODEL_RUN_ID" \
            --artifact-dir "$RUNNER_TEMP/native-f16"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-publication-report-${{ github.run_id }}
          path: ${{ env.HEAVY_OUT }}/
          if-no-files-found: warn
          retention-days: 90
