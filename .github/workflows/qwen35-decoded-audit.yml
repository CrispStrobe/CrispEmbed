permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # test_xiaomi_precision_replay.py exercises the numpy comparator directly.
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python tests/test_qwen35_decoded_panel.py -v
      - run: python tests/test_qwen35_profiling.py -v
      - run: python tests/test_qwen35_materialization.py -v
      - run: python tests/test_qwen35_receipt.py -v
      - run: python tests/test_xiaomi_evidence.py -v
      - run: python tests/test_xiaomi_converter_contract.py -v
      - run: python tests/test_xiaomi_hosted_export.py -v
      - run: python tests/test_xiaomi_export_evidence.py -v
      - run: python tests/test_xiaomi_native_stage.py -v
      - run: python tests/test_xiaomi_native_patch_evidence.py -v
      - run: python tests/test_xiaomi_precision_replay.py -v
      - run: python tests/test_xiaomi_position_replay.py -v
      - run: python tests/test_xiaomi_layer0_replay.py -v
      - run: python tests/test_xiaomi_position_replay_evidence.py -v
      - run: python tests/test_xiaomi_vision_prefill_stage.py -v
      - run: python tests/test_xiaomi_vision_prefill_hosted_evidence.py -v
      - run: python tests/test_xiaomi_vision_prefill_local.py -v
      - run: python tests/test_xiaomi_ci_vision_prefill.py -v
      - run: python tests/test_verify_gguf_export.py -v
  profile-counters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure portable CPU counters
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_METAL=OFF -DCRISPEMBED_BUILD_SHARED=OFF
      - name: Build counter controls
        run: cmake --build build --config Release --target test-qwen35-profile test-qwen35-materialize test-qwen35-weight-cache test-qwen35-quant -j4
      - name: Counter controls (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/test-qwen35-profile
          ./build/test-qwen35-materialize
          ./build/test-qwen35-weight-cache
          ./build/test-qwen35-quant --request-controls
      - name: Counter controls (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$PWD/build/Release;$PWD/build/bin/Release;$PWD/build/bin;$env:PATH"
          & ./build/Release/test-qwen35-profile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/test-qwen35-materialize.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/test-qwen35-weight-cache.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/test-qwen35-quant.exe --request-controls
          exit $LASTEXITCODE
