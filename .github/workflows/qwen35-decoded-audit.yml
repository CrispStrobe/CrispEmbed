name: Qwen3.5 decoded audit controls

on:
  push:
    paths:
      - '.github/workflows/qwen35-decoded-audit.yml'
      - 'tools/ci-heavy/qwen35_decoded_panel.py'
      - 'tools/ci-heavy/qwen35_page_parity.py'
      - 'tools/ci-heavy/qwen35_quant_calibration.py'
      - 'tools/ci-heavy/qwen35_vision_operators.py'
      - 'tests/test_qwen35_decoded_panel.py'
      - 'tests/test_qwen35_profiling.py'
      - 'tests/test_qwen35_profile.cpp'
      - 'tests/test_qwen35_quant.cpp'
      - 'tests/test_qwen35_receipt.py'
      - 'tools/ci-heavy/qwen35_receipt.py'
      - 'tools/dump_qwen35_ocr_page_reference.py'
      - 'tests/test_qwen35_materialize.cpp'
      - 'tests/test_qwen35_materialization.py'
      - 'tools/ci-heavy/qwen35_materialization.py'
      - 'src/qwen35_math.h'
      - 'src/qwen35_profile.*'
      - 'src/qwen35_linear.cpp'
      - 'src/qwen35_ocr.cpp'
      - 'tools/ci-heavy/qwen35_profiling.py'
      - 'CMakeLists.txt'
      - 'tests/results/qwen35-ocr/page-parity.json'
  pull_request:
    paths:
      - '.github/workflows/qwen35-decoded-audit.yml'
      - 'tools/ci-heavy/qwen35_decoded_panel.py'
      - 'tools/ci-heavy/qwen35_page_parity.py'
      - 'tools/ci-heavy/qwen35_quant_calibration.py'
      - 'tools/ci-heavy/qwen35_vision_operators.py'
      - 'tests/test_qwen35_decoded_panel.py'
      - 'tests/test_qwen35_profiling.py'
      - 'tests/test_qwen35_profile.cpp'
      - 'tests/test_qwen35_quant.cpp'
      - 'tests/test_qwen35_receipt.py'
      - 'tools/ci-heavy/qwen35_receipt.py'
      - 'tools/dump_qwen35_ocr_page_reference.py'
      - 'tests/test_qwen35_materialize.cpp'
      - 'tests/test_qwen35_materialization.py'
      - 'tools/ci-heavy/qwen35_materialization.py'
      - 'src/qwen35_math.h'
      - 'src/qwen35_profile.*'
      - 'src/qwen35_linear.cpp'
      - 'src/qwen35_ocr.cpp'
      - 'tools/ci-heavy/qwen35_profiling.py'
      - 'CMakeLists.txt'
      - 'tests/results/qwen35-ocr/page-parity.json'

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_qwen35_decoded_panel.py -v
      - run: python tests/test_qwen35_profiling.py -v
      - run: python tests/test_qwen35_materialization.py -v
      - run: python tests/test_qwen35_receipt.py -v

  profile-counters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure portable CPU counters
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_METAL=OFF -DCRISPEMBED_BUILD_SHARED=OFF
      - name: Build counter controls
        run: cmake --build build --config Release --target test-qwen35-profile test-qwen35-materialize test-qwen35-quant -j4
      - name: Counter controls (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/test-qwen35-profile
          ./build/test-qwen35-materialize
          ./build/test-qwen35-quant --request-controls
      - name: Counter controls (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$PWD/build/Release;$PWD/build/bin/Release;$PWD/build/bin;$env:PATH"
          & ./build/Release/test-qwen35-profile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/test-qwen35-materialize.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/test-qwen35-quant.exe --request-controls
          exit $LASTEXITCODE
