name: MoEdern one-document actual router stages v1
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed forty-hex diagnostic source
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: moedern-first-row-stages-v1
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE: ${{ inputs.source_ref }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source controls and all retained packet bytes before optional packages
        run: |
          python tests/test_moedern_first_row_v1.py -v
          python -I tools/moedern-first-row/prepare.py --reviewed-source "$SOURCE" --out "$RUNNER_TEMP/first-row-input"
      - name: Same original CPU runtime; loaded source and checkpoint checks remain mandatory
        run: |
          python -m venv "$RUNNER_TEMP/first-row-env"
          "$RUNNER_TEMP/first-row-env/bin/python" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/first-row-env/bin/python" -m pip install numpy==2.2.6 transformers==5.3.0 'sentence-transformers @ git+https://github.com/huggingface/sentence-transformers.git@b0bf39968ba461c34b29372144794eff1be06f6d' gguf==0.17.1
          "$RUNNER_TEMP/first-row-env/bin/python" -m pip check
          "$RUNNER_TEMP/first-row-env/bin/python" -m pip freeze > "$RUNNER_TEMP/first-row-runtime.txt"
      - name: Both ordinary barriers before actual ATen, module and SDPA capture
        run: |
          "$RUNNER_TEMP/first-row-env/bin/python" -I tools/ci-heavy/moedern_first_row_v1.py --reviewed-source "$SOURCE" --input "$RUNNER_TEMP/first-row-input" --scratch "$RUNNER_TEMP/first-row-build" --out "$RUNNER_TEMP/first-row-out"
      - name: Small complete or failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moedern-first-row-v1-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-row-input/prepare.json
            ${{ runner.temp }}/first-row-input/input-packet.json
            ${{ runner.temp }}/first-row-input/retained-compare.json
            ${{ runner.temp }}/first-row-out/review/
            ${{ runner.temp }}/first-row-runtime.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Exact retained packets, observed stages and lossless Ref adapters remotely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moedern-first-row-v1-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/first-row-input/
            ${{ runner.temp }}/first-row-out/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
