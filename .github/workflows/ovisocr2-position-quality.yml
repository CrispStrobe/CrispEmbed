name: OvisOCR2 position alternative first-F16 quality replay
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  quality:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        gate: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CRISPEMBED_QWEN35_VISION_SOURCE_INTERPOLATION: ${{ matrix.gate }}
      CRISPEMBED_QWEN35_WEIGHT_CACHE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit candidate closure and frozen document preparation
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/scratch"
            echo "HF_HOME=$RUNNER_TEMP/scratch/hf"
          } >> "$GITHUB_ENV"
          python tools/ci-heavy/ovisocr2_position_replay.py --preflight > "$RUNNER_TEMP/out/position-source-contract.json"
          HEAVY_OUT="$RUNNER_TEMP/out" HEAVY_SCRATCH="$RUNNER_TEMP/scratch" python tools/ci-heavy/ovisocr2_quality_run.py --phase f16 --original-run 40054043629 --prepare-documents
      - name: Original pinned framework stack
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 pillow==12.1.0 huggingface-hub==1.33.0 gguf==0.19.0 safetensors==0.8.0
      - name: Actual eleven-case F16 replay and C ABI smoke
        run: python tools/ci-heavy/ovisocr2_quality_run.py --phase f16 --original-run 40054043629
      - name: Immutable first-F16 decoded comparison and measured confidence drift
        if: always()
        run: python tools/ci-heavy/ovisocr2_position_replay.py --verify-quality "$HEAVY_OUT/ovisocr2-quality.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr2-position-quality-gate${{ matrix.gate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
