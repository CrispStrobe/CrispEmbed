# Guards the crates.io publishability of crispembed-sys / crispembed.
#
# The published crate builds from a VENDORED copy of the C/C++ sources, because
# cargo only packages files under the crate root. `cargo package` verify-BUILDS
# the unpacked tarball, so this job proves the vendoring is still complete.
# Without it, a source file added to CMakeLists.txt builds fine in-tree and
# breaks only the published crate — with no warning at publish time.
#
# Scoped to the paths that can invalidate the vendored set; the full build/test
# matrix lives in build.yml.
name: Rust crates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: rust-crates-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select necessary CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select

  arm-types:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: ARM64 wrapper C ABI types
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      # cargo check needs no linkable model runtime. Mark the prebuilt path so
      # build.rs emits metadata without starting an unrelated native build.
      # Linux ARM64 c_char is unsigned; signed i8 annotations compile on x64
      # but fail here, preventing every model from loading through Rust.
      - name: Check platform C-char signatures without a native source build
        run: |
          mkdir -p "$RUNNER_TEMP/typecheck-lib"
          touch "$RUNNER_TEMP/typecheck-lib/libcrispembed.so"
          CRISPEMBED_SYS_LIB_DIR="$RUNNER_TEMP/typecheck-lib" cargo check --workspace

  package:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # compiles ggml + crispembed from the vendored sources
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # Cache compiler objects, not target/ or a previously verified package.
      # Both fresh source configurations and the standalone link still happen.
      - uses: ./.github/actions/compiler-cache
        with:
          namespace: rust-source-release-cpu
          rust: 'true'
          native_cpu: 'true'

      # Nothing in CI compiled the Rust wrapper before this job, which is how
      # `main` came to have a crispembed/src/lib.rs that did not build at all
      # (018b6c77 added OcrResult::orientation_corrected and missed one
      # initializer). Checked first — it is fast and fails loudly.
      - name: Build the wrapper and the -sys crate
        run: cargo build --workspace --release

      # The prebuilt-library path must work with NO C/C++ sources present —
      # that is the whole point of CRISPEMBED_SYS_LIB_DIR, and the README
      # documents it as "no cmake, no source build". It regressed silently when
      # build.rs started calling resolve_src_root() unconditionally at the top
      # of main(): a consumer with a perfectly good libcrispembed.so got
      # "crispembed sources not found" instead. Nothing here caught it, because
      # every other job runs in-tree where the sources obviously exist.
      #
      # Compiling build.rs standalone is enough to exercise the decision, and
      # costs a second — a full `cargo build` would drag in the crate's deps
      # and, on the failure path, an actual cmake run.
      - name: build.rs honours a prebuilt without any sources
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/consumer/crispembed-sys" "$work/prebuilt"
          : > "$work/prebuilt/libcrispembed.so"
          CARGO_MANIFEST_DIR="$work/consumer/crispembed-sys" \
            rustc --edition 2021 crispembed-sys/build.rs -o "$work/buildrs"
          # Match on the trailing component rather than the absolute path: the
          # emitted path is whatever the process sees, which is not always
          # byte-identical to the shell's $work.
          out=$(CRISPEMBED_SYS_LIB_DIR="$work/prebuilt" CARGO_CFG_TARGET_OS=linux "$work/buildrs")
          echo "$out"
          grep -qE '^cargo:LIB_DIR=.*[/\\]prebuilt$' <<<"$out" || {
              echo "FAIL: build.rs did not link the prebuilt library" >&2; exit 1; }
          # And the sibling build/ probe, also without sources.
          mkdir -p "$work/consumer/build"
          : > "$work/consumer/build/libcrispembed.so"
          out=$(CARGO_CFG_TARGET_OS=linux "$work/buildrs")
          grep -qE '^cargo:LIB_DIR=.*[/\\]build$' <<<"$out" || {
              echo "FAIL: build.rs did not find the sibling build/ directory" >&2; exit 1; }
          echo "OK: prebuilt paths work with no sources present"

      - name: Vendor the C/C++ sources
        run: scripts/vendor_rust_sources.sh

      # --allow-dirty: the vendored tree is gitignored yet packaged (`include`
      # overrides .gitignore), which cargo reports as uncommitted changes.
      - name: Verify the packaged crate builds standalone
        working-directory: crispembed-sys
        run: cargo package --allow-dirty

  result:
    name: Rust crates result
    if: always()
    needs: [changes, arm-types, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector changes
          arm-types=rust package=rust
