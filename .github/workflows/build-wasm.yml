name: Build WASM

# Push and PR use the same dependency map (tools/ci_selection.py). Pure
# docs/evidence changes start no run (the paths filter below; main has no
# required checks). Every other change runs the cheap selector, the jobs it
# selects, and an always-run result check that rejects unexpected skips.
on:
  push:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  pull_request:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'models/licenses/apache-2.0/LICENSE'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
      # Re-included contract globs must not re-enable Markdown-only runs.
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

# A docs-only main push selects no build and must not cancel the previous
# code-bearing push. PR diffs are cumulative, so superseded PR runs can cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  changes:
    name: Select necessary CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_windows: ${{ steps.select.outputs.native_windows }}
      native_macos: ${{ steps.select.outputs.native_macos }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      desktop: ${{ steps.select.outputs.desktop }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select

  build-wasm:
    needs: changes
    if: needs.changes.outputs.wasm_ocr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pin to 6.0.2 — the last emsdk that built this repo green (CI was
          # green on 6.0.2, red from 6.0.3 onward). 6.0.3's clang (23.0.0git)
          # segfaults with an internal compiler crash on src/layout_detect.cpp.
          # Do not use 3.1.64 here: it predates the emdawnwebgpu port that the
          # WebGPU tier needs.
          version: '6.0.2'

      - name: Build WASM
        run: ./build-wasm.sh --clean

      - name: Size report (largest sections, owners and functions)
        run: |
          python3 tools/wasm_size_report.py build-wasm/crispembed_ocr.wasm \
            build-wasm/crispembed_ocr.js.symbols --top=80

      - name: Verify output
        run: |
          ls -lh build-wasm/crispembed_ocr.js build-wasm/crispembed_ocr.wasm
          echo "JS size: $(wc -c < build-wasm/crispembed_ocr.js) bytes"
          echo "WASM size: $(wc -c < build-wasm/crispembed_ocr.wasm) bytes"
          # Sanity: WASM should be < 4 MB (full OCR pipeline), JS < 200 KB
          [ $(wc -c < build-wasm/crispembed_ocr.wasm) -lt 4194304 ] || (echo "WASM too large" && exit 1)

      - name: Node smoke + wrapper unit tests (real WASM module)
        run: |
          node tests/test_wasm_ocr_live.js
          node tests/test_wasm_ocr_wrapper.js

      - name: Browser end-to-end test (headless Chromium, real model)
        run: |
          mkdir -p /tmp/wasm-models
          curl -sL "https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf" \
            -o /tmp/wasm-models/pix2tex-mfr-q4_k.gguf
          cd tests/wasm-browser
          npm install
          npx playwright install --with-deps chromium
          CRISPEMBED_MODELS_DIR=/tmp/wasm-models node e2e.test.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crispembed-wasm
          path: |
            build-wasm/crispembed_ocr.js
            build-wasm/crispembed_ocr.wasm
            wasm/crispembed-ocr.js
          retention-days: 30

  result:
    name: OCR WASM result
    if: always()
    needs: [changes, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector changes
          build-wasm=wasm_ocr
