name: Build WASM

# Push and PR use the same dependency map. Jobs are filtered, not the workflow,
# so a required result check also completes for documentation-only changes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A docs-only main push selects no build and must not cancel the previous
# code-bearing push. PR diffs are cumulative, so superseded PR runs can cancel.
concurrency:
  group: build-wasm-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select necessary CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select

  build-wasm:
    needs: changes
    if: needs.changes.outputs.wasm_ocr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pin to 6.0.2 — the last emsdk that built this repo green (CI was
          # green on 6.0.2, red from 6.0.3 onward). 6.0.3's clang (23.0.0git)
          # segfaults with an internal compiler crash on src/layout_detect.cpp.
          # Do not use 3.1.64 here: it predates the emdawnwebgpu port that the
          # WebGPU tier needs.
          version: '6.0.2'

      - name: Build WASM
        run: ./build-wasm.sh --clean

      - name: Size report (largest sections, owners and functions)
        run: |
          python3 tools/wasm_size_report.py build-wasm/crispembed_ocr.wasm \
            build-wasm/crispembed_ocr.js.symbols --top=80

      - name: Verify output
        run: |
          ls -lh build-wasm/crispembed_ocr.js build-wasm/crispembed_ocr.wasm
          echo "JS size: $(wc -c < build-wasm/crispembed_ocr.js) bytes"
          echo "WASM size: $(wc -c < build-wasm/crispembed_ocr.wasm) bytes"
          # Sanity: WASM should be < 4 MB (full OCR pipeline), JS < 200 KB
          [ $(wc -c < build-wasm/crispembed_ocr.wasm) -lt 4194304 ] || (echo "WASM too large" && exit 1)

      - name: Node smoke + wrapper unit tests (real WASM module)
        run: |
          node tests/test_wasm_ocr_live.js
          node tests/test_wasm_ocr_wrapper.js

      - name: Browser end-to-end test (headless Chromium, real model)
        run: |
          mkdir -p /tmp/wasm-models
          curl -sL "https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf" \
            -o /tmp/wasm-models/pix2tex-mfr-q4_k.gguf
          cd tests/wasm-browser
          npm install
          npx playwright install --with-deps chromium
          CRISPEMBED_MODELS_DIR=/tmp/wasm-models node e2e.test.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crispembed-wasm
          path: |
            build-wasm/crispembed_ocr.js
            build-wasm/crispembed_ocr.wasm
            wasm/crispembed-ocr.js
          retention-days: 30

  result:
    name: OCR WASM result
    if: always()
    needs: [changes, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector changes
          build-wasm=wasm_ocr
