name: LFM2 precise arithmetic fixture

on:
  push:
    branches: [main]
    paths:
      - 'src/lfm2_embed.cpp'
      - 'src/core/quant_f32_matmul.h'
      - 'tests/test_quant_f32_matmul.cpp'
      - 'src/core/gelu_tanh_f32.h'
      - 'tests/test_gemma_decision_activation.cpp'
      - 'src/core/decision_schema.h'
      - 'src/core/unicode_categ.h'
      - 'src/core/shortest_double.*'
      - 'src/core/third_party/ryu/**'
      - 'tests/gemma_decision_rendering.py'
      - 'CMakeLists.txt'
      - 'ggml'
      - '.github/workflows/lfm2-arithmetic.yml'
  pull_request:
    paths:
      - 'src/lfm2_embed.cpp'
      - 'src/core/quant_f32_matmul.h'
      - 'tests/test_quant_f32_matmul.cpp'
      - 'src/core/gelu_tanh_f32.h'
      - 'tests/test_gemma_decision_activation.cpp'
      - 'src/core/decision_schema.h'
      - 'src/core/unicode_categ.h'
      - 'src/core/shortest_double.*'
      - 'src/core/third_party/ryu/**'
      - 'tests/gemma_decision_rendering.py'
      - 'CMakeLists.txt'
      - 'ggml'
      - '.github/workflows/lfm2-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes/PR updates on a branch cancel its older runs. Main pushes and
# manual dispatches get one group per run, so they are never cancelled or dropped.
concurrency:
  group: lfm2-arithmetic-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  outlier-activations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CPU fixture
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRISPEMBED_NATIVE=OFF
          cmake --build build --target test-quant-f32-matmul test-gemma-decision-activation test-gemma-decision-schema -j2
      - name: Verify FP32 activations survive quantized-weight matmuls
        run: |
          build/test-quant-f32-matmul
          build/test-gemma-decision-activation
          python3 tests/gemma_decision_rendering.py build/test-gemma-decision-schema
