name: UltraBERT frozen SciFact native v3
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: ultrabert-scifact-native-v3-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Task-owned hosted paths
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scifact-native-v3"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/scifact-native-v3"
            echo "HF_HOME=$RUNNER_TEMP/hf-native-v3"
          } >> "$GITHUB_ENV"
      - run: python tests/test_ultrabert_scifact_native_v3.py -v
      - run: python -m pip install numpy==2.2.6 gguf==0.19.0 huggingface-hub==1.33.0 safetensors==0.8.0
      - run: python tools/ci-heavy/ultrabert_scifact_native_v3.py --phase build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-build
          path: ${{ runner.temp }}/out/payload/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-build-review
          path: |
            ${{ runner.temp }}/out/*.json
            ${{ runner.temp }}/out/*.log
          retention-days: 90
  native:
    needs: build
    name: native-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Task-owned hosted paths
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scifact-native-v3"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/scifact-native-v3"
            echo "HF_HOME=$RUNNER_TEMP/hf-native-v3"
          } >> "$GITHUB_ENV"
      - run: python -m pip install numpy==2.2.6
      - name: Frozen original inputs and actual public CAPI IDs first
        env:
          SHARD: ${{ matrix.shard }}
        run: python tools/ci-heavy/ultrabert_scifact_native_v3.py --phase native --shard "$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/payload/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-review-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/out/*.json
            ${{ runner.temp }}/out/*.log
          retention-days: 90
  aggregate:
    needs: [build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Task-owned hosted paths
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scifact-native-v3"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/scifact-native-v3"
            echo "HF_HOME=$RUNNER_TEMP/hf-native-v3"
          } >> "$GITHUB_ENV"
      - run: python -m pip install numpy==2.2.6
      - run: python tools/ci-heavy/ultrabert_scifact_native_v3.py --phase aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-quality
          path: ${{ runner.temp }}/out/payload/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultrabert-scifact-native-v3-quality-review
          path: |
            ${{ runner.temp }}/out/*.json
            ${{ runner.temp }}/out/*.log
          retention-days: 90
