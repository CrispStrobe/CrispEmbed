name: Build

# Push and PR use the same dependency map (tools/ci_selection.py). Pure
# docs/evidence changes start no run (the paths filter below; main has no
# required checks). Every other change runs the cheap selector, the jobs it
# selects, and an always-run result check that rejects unexpected skips.
on:
  push:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
  pull_request:
    branches: [main]
    # Pure documentation/evidence changes start no run at all. Everything
    # else reaches the selector job, which routes it (tools/ci_selection.py);
    # tests/test_ci_selection.py proves every file excluded here selects no
    # lane. Identical in all five ordinary workflows, for push and PR.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tests/results/**'
      - '!handover-prompts/**'
      - '!hf_readmes/**'
      - '!.github/workflows/**'
      - '!tools/ci-heavy/**'
      - '!tools/kaggle/**'
      - '!tools/colab/**'
      - '!models/**'
      - 'docs/*inpaint*'
      - 'docs/migan*'
      - 'docs/teleocr-publication-v1.json'
      - 'tests/results/migan/**'
      - 'tests/results/ultrabert/**'
      - 'tools/ci-heavy/*ultrabert*'
      - 'tools/ci-heavy/migan_native.py'
      - 'tools/ci-heavy/inpaint_gguf_publish.py'
      - 'tools/kaggle/*/kaggle_harness.py'
      - 'models/convert-migan-to-gguf.py'
      - 'models/convert-latent-inpaint-to-gguf.py'
      - 'models/convert-ultrabert-to-gguf.py'
      - 'tests/results/**.c'
      - 'tests/results/**.cc'
      - 'tests/results/**.cpp'
      - 'tests/results/**.h'
      - 'tests/results/**.hpp'
      - 'tools/**.c'
      - 'tools/**.cc'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'tools/**.hpp'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/build-wasm-embed.yml'
      - '.github/workflows/rust-crates.yml'
      - '.github/workflows/inpaint-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

# A docs-only main push selects no build and must not cancel the previous
# code-bearing push. PR diffs are cumulative, so superseded PR runs can cancel.
concurrency:
  group: build-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      native_windows: ${{ steps.select.outputs.native_windows }}
      native_macos: ${{ steps.select.outputs.native_macos }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      mobile: ${{ steps.select.outputs.mobile }}
      sibling: ${{ steps.select.outputs.sibling }}
      wasm_ocr: ${{ steps.select.outputs.wasm_ocr }}
      wasm_embed: ${{ steps.select.outputs.wasm_embed }}
      rust: ${{ steps.select.outputs.rust }}
      inpaint_python: ${{ steps.select.outputs.inpaint_python }}
      inpaint_native: ${{ steps.select.outputs.inpaint_native }}
      bundle: ${{ steps.select.outputs.bundle }}
      desktop: ${{ steps.select.outputs.desktop }}
      full: ${{ steps.select.outputs.full }}
      desktop_matrix: ${{ steps.desktop.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: CI selection and aggregate-gate controls
        run: python3 tests/test_ci_selection.py -v
      - id: select
        uses: ./.github/actions/ci-select
      # Desktop legs: Linux for every compiled change; Windows (MSVC) for PR
      # source edits; macOS for Apple/Metal-specific sources. Main pushes with
      # compiled changes, shared core/CMake/ggml and manual runs select all
      # three (tools/ci_selection.py). The platform table lives here.
      - id: desktop
        name: Desktop matrix for the selected legs
        shell: python
        env:
          SELECTED: ${{ steps.select.outputs.desktop }}
        run: |
          import json, os
          platforms = [
              {"name": "linux-x86_64", "os": "ubuntu-latest",
               "cmake_args": "-DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_LLAMAFILE=ON",
               "lib_name": "libcrispembed.so"},
              {"name": "macos-arm64", "os": "macos-latest",
               "cmake_args": "-DGGML_NATIVE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple",
               "lib_name": "libcrispembed.dylib"},
              {"name": "windows-x86_64", "os": "windows-latest",
               "cmake_args": "-DGGML_NATIVE=OFF -DGGML_BLAS=OFF",
               "lib_name": "crispembed.dll"},
          ]
          selected = json.loads(os.environ["SELECTED"])
          known = {p["name"] for p in platforms}
          if not isinstance(selected, list) or not set(selected) <= known:
              raise SystemExit("invalid desktop selection: %r" % (selected,))
          # Never an empty matrix: the build job is skipped when native is false.
          include = [p for p in platforms if p["name"] in selected] or platforms[:1]
          print("Desktop legs:", ", ".join(p["name"] for p in include))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(include) + "\n")
      - name: Test mains route through clean_exit
        run: bash tools/check_test_clean_exit.sh
      - name: Workflow toolchains are version-pinned
        run: bash tools/check_workflow_pins.sh
      - name: Pin guard self-test
        run: bash tools/test_check_workflow_pins.sh
      - name: GPU recipe process deadline controls (model-free)
        run: python3 tests/test_lfm2_performance_process.py -v
      - name: pub.dev release preflight contracts (model-free)
        run: python3 tests/test_pubdev_release_gate.py -v
      - name: Unlimited-OCR-2 quantizer policy equals its measured recipe (model-free)
        run: |
          python3 -m pip install -q numpy==2.2.6
          python3 tests/test_unlimited_ocr2_quant_policy.py
      - name: OCR review client copying and older-library fallback
        run: python3 tests/test_ocr_review_binding.py

  build:
    needs: guards
    if: needs.guards.outputs.native == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guards.outputs.desktop_matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/compiler-cache
        with:
          namespace: desktop-${{ matrix.name }}-release-portable

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCRISPEMBED_BUILD_SHARED=ON
          -DCRISPEMBED_NATIVE=OFF
          ${{ matrix.cmake_args }}

      # Development bundles cross hosts just like release bundles. Never let
      # the runner CPU decide their minimum ISA requirements.
      - name: Verify portable CPU baseline
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check-cpu-baseline.py build

      - name: Build all native targets
        if: needs.guards.outputs.native_tests == 'true'
        run: cmake --build build --config Release -j4

      - name: Build delivered native targets for isolated CLI changes
        if: needs.guards.outputs.native_tests != 'true'
        run: >-
          cmake --build build --config Release -j4
          --target crispembed-cli crispembed-marker crispembed-server
          crispembed-quantize crispembed-shared test-backend-smoke

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/crispembed --help 2>&1 || true
          ./build/test-backend-smoke

      # Model-free correctness tests. They need no weights and no network, so
      # they belong on every push rather than in the artifact-gated tiers.
      # The provenance ones in particular guard claims we make in POLICY.md:
      # that every emitted image is marked, that the marking is a structurally
      # valid PNG chunk, and that we never assert wholly-synthetic media.
      - name: Model-free tests (Unix)
        if: runner.os != 'Windows' && needs.guards.outputs.native_tests == 'true'
        run: |
          cmake --build build --config Release -j4 \
            --target test-image-provenance test-provenance-marking test-msac-tiling test-temp-file test-render-provenance \
                     test-qwen-pretokenize test-o200k-pretokenize test-bpe-pretokenize test-bert-pretokenize \
                     test-bert-norm test-spm-norm test-pair-truncation test-imatrix-alias test-no-repeat-ngram test-env-gate test-env-gate-words test-ppocrv6-det-policy test-low-memory \
                     test-lfm2-tiling test-pil-resize test-server-json-input test-server-load-control test-punct-marks test-qwen35-profile test-qwen35-materialize test-ultrabert-profile \
                     test-marker-document test-marker-api test-marker-backend test-marker-save test-ocr-review test-ocr-orchestrator test-ocr-render test-ocr-photo \
                     test-mineru25-profile test-lightonocr3-contract lightonocr3-trace test-xiaomi0-frontend test-xiaomi0-run test-xiaomi0-public test-nemotron-parse-geometry
          ./build/test-image-provenance
          ./build/test-provenance-marking
          ./build/test-msac-tiling
          ./build/test-temp-file
          ./build/test-render-provenance
          ./build/test-qwen-pretokenize
          ./build/test-o200k-pretokenize
          ./build/test-bpe-pretokenize
          ./build/test-bert-pretokenize
          ./build/test-bert-norm
          ./build/test-spm-norm
          ./build/test-pair-truncation
          ./build/test-imatrix-alias
          ./build/test-no-repeat-ngram
          ./build/test-env-gate
          ./build/test-env-gate-words
          ./build/test-ppocrv6-det-policy
          ./build/test-low-memory
          ./build/test-lfm2-tiling
          ./build/test-pil-resize
          ./build/test-server-json-input
          ./build/test-server-load-control
          ./build/test-punct-marks
          ./build/test-qwen35-profile
          ./build/test-qwen35-materialize
          ./build/test-ultrabert-profile
          ./build/test-mineru25-profile
          ./build/test-lightonocr3-contract
          # Xiaomi frontend needs its original-processor GGUF fixture; compiled
          # here, executed by the separately dispatched metadata/reference lane.
          ./build/test-nemotron-parse-geometry self
          ./build/test-marker-document
          ./build/test-ocr-review
          ./build/test-ocr-photo self
          ./build/test-ocr-render
          ./build/test-ocr-orchestrator
          ./build/test-marker-api
          ./build/test-marker-save
          # Geometry and malformed-input controls run without PDFium or weights.
          # The optional PDFium cases are exercised by the retained full panel.
          ./build/test-marker-backend
          python3 tests/test_ultrabert_api_log.py -v
          python3 tests/test_vendored_kaggle_harness.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          $runtimeDirs = @(
            "$PWD\build\Release",
            "$PWD\build\bin\Release",
            "$PWD\build\bin"
          )
          $env:PATH = ($runtimeDirs -join ';') + ';' + $env:PATH
          & .\build\Release\crispembed.exe --help
          if ($LASTEXITCODE -ne 0) {
            Write-Host "crispembed --help exited with $LASTEXITCODE (ignored)"
          }
          & .\build\Release\test-backend-smoke.exe cpu --json
          exit $LASTEXITCODE
        shell: pwsh

      - name: Smoke test (explicit Metal)
        if: runner.os == 'macOS'
        run: ./build/test-backend-smoke metal

      # Install into a staging prefix so the shared library is bundled with its
      # ggml runtime dylibs/sos and rewritten to a relocatable @loader_path /
      # $ORIGIN rpath. The build-tree library bakes in absolute runner paths and
      # ships without ggml, so it can't load on a consumer machine — the install
      # tree can. lib/ holds *.so / *.dylib; bin/ holds *.dll (Windows).
      - name: Install (bundle native libs)
        run: cmake --install build --config Release --prefix dist

      # The macOS bundle feeds the Flutter plugin's macos/Libs (bundle-flutter
      # below). upload-artifact turns the install tree's SOVERSION symlinks
      # into separate copies and CocoaPods drops or dereferences them, so the
      # app never held every name the load commands ask for. Flatten to one
      # real file per library under its unversioned install name (the same
      # script release.yml and the podspec use), then fail if any @rpath
      # reference (otool -L) of a dylib or of the installed CLI is not a
      # regular file in the set, and dlopen it from there.
      - name: Flatten and verify macOS dylib set
        if: runner.os == 'macOS'
        run: |
          bins=$(find dist/bin -maxdepth 1 -type f -perm -u+x 2>/dev/null || true)
          sh flutter/crispembed/macos/flatten_dylibs.sh dist/lib $bins
          sh flutter/crispembed/macos/flatten_dylibs.sh --check dist/lib $bins
          for f in dist/lib/*.dylib; do codesign --verify "$f"; done
          python3 -c "import ctypes,sys; ctypes.CDLL(sys.argv[1]).crispembed_init; print('dlopen OK')" \
              "$PWD/dist/lib/libcrispembed.dylib"

      - name: Upload shared library bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/lib/
            dist/bin/
          if-no-files-found: warn

  sibling-crispasr:
    needs: guards
    if: needs.guards.outputs.sibling == 'true'
    name: sibling-crispasr (shared libs)
    runs-on: ubuntu-latest
    # Issue #50. CrispEmbed's CMakeLists defaults CRISP_AUDIO_DIR /
    # CRISP_PUNC_DIR / CRISP_LID_DIR / CRISP_TRUECASE_DIR to ../CrispASR/*, and
    # add_subdirectory()s each one it finds — the documented dev-machine layout
    # (~/code/CrispEmbed beside ~/code/CrispASR). Those four libraries then
    # compile against THIS repo's src/core, so any header CrispASR's core has
    # and CrispEmbed's does not breaks a from-source build here while both
    # repos stay green on their own. That is exactly how #50 shipped: twice, as
    # a std::map/std::unordered_map mismatch in audio_tower.cpp and then as a
    # missing core/ggml_cpu_backend.h. Every job above builds CrispEmbed ALONE,
    # so none of them can see it.
    #
    # Builds only the four shared-library targets: it is the cross-repo header
    # contract under test, not CrispEmbed itself (the matrix above covers that).
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/compiler-cache
        with:
          namespace: sibling-release
          native_cpu: 'true'

      - name: Clone CrispASR as a sibling
        run: git clone --depth 1 https://github.com/CrispStrobe/CrispASR.git ../CrispASR

      - name: Configure with the sibling defaults
        run: |
          set -euo pipefail
          cmake -S . -B build-sibling -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
          # Assert the defaults actually picked the sibling up. Each of the four
          # has a clean "not found — disabled" fallback, so without this the job
          # would go green having compiled none of the code it exists to cover.
          for lib in crisp_audio crisp_punc crisp_lid crisp_truecase; do
            grep -q "linking $lib from" configure.log || {
              echo "::error::$lib was NOT picked up from ../CrispASR — this job is testing nothing"
              exit 1
            }
          done
        shell: bash

      - name: Build the four shared libraries
        run: cmake --build build-sibling -j4 --target crisp_audio crisp_punc crisp_lid crisp_truecase

      # The mirrored files must not drift. CrispASR has test-copies-in-sync for
      # its own duplicated copies and it is the most effective test in either
      # tree; this is the cross-repo half, which did not exist and which issue
      # #50 is the cost of. Only meaningful with a sibling checkout, so it lives
      # in this job rather than the model-free tier.
      - name: Mirrored files are in sync with CrispASR
        run: |
          set -euo pipefail
          cmake --build build-sibling -j4 --target test-cross-repo-sync
          CRISPEMBED_SOURCE_DIR="$PWD" \
          CRISPASR_SIBLING_DIR="$PWD/../CrispASR" \
            ./build-sibling/test-cross-repo-sync
        shell: bash

  build-android:
    needs: guards
    if: needs.guards.outputs.mobile == 'true'
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/compiler-cache
        with:
          namespace: android-${{ matrix.abi }}-release

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRISPEMBED_BUILD_SHARED=ON \
            -DGGML_LLAMAFILE=OFF
          cmake --build build -j4 --target crispembed-shared

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build/libcrispembed.so
          if-no-files-found: warn

  build-ios:
    needs: guards
    if: needs.guards.outputs.mobile == 'true'
    name: ios-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/compiler-cache
        with:
          namespace: ios-arm64-release-metal

      - name: Build
        run: |
          # Use Unix Makefiles (not Xcode) to avoid MACOSX_BUNDLE issues
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DCMAKE_C_COMPILER=$(xcrun --sdk iphoneos -f clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun --sdk iphoneos -f clang++) \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRISPEMBED_BUILD_SHARED=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build build -j4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: build/libcrispembed-static.a
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Bundle all native libraries into the Flutter plugin's platform directories
  # so that `flutter build` can find them.
  # -------------------------------------------------------------------------
  bundle-flutter:
    name: Bundle Flutter plugin
    runs-on: ubuntu-latest
    needs: [guards, build, build-android, build-ios]
    if: needs.guards.outputs.bundle == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place artifacts in Flutter plugin dirs
        run: |
          set +e  # don't abort on missing artifacts
          PLUGIN=flutter/crispembed

          # Desktop artifacts are now self-contained install bundles: the shared
          # library plus its ggml runtime libs live under lib/ (Unix) or bin/
          # (Windows). Copy the whole set so the plugin ships every dependency.

          # Linux (lib/*.so + ggml *.so siblings)
          cp artifacts/linux-x86_64/lib/*.so* \
             $PLUGIN/linux/lib/ 2>/dev/null || echo "SKIP: linux"

          # macOS (lib/*.dylib + ggml *.dylib siblings)
          cp artifacts/macos-arm64/lib/*.dylib \
             $PLUGIN/macos/Libs/ 2>/dev/null || echo "SKIP: macos"

          # Windows (bin/*.dll: crispembed.dll + ggml DLLs)
          cp artifacts/windows-x86_64/bin/*.dll \
             $PLUGIN/windows/lib/ 2>/dev/null || echo "SKIP: windows"

          # iOS
          cp artifacts/ios-arm64/libcrispembed-static.a \
             $PLUGIN/ios/Libs/libcrispembed-static.a 2>/dev/null || echo "SKIP: ios"

          # Android (per-ABI)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp artifacts/android-${abi}/libcrispembed.so \
               $PLUGIN/android/src/main/jniLibs/${abi}/libcrispembed.so 2>/dev/null || echo "SKIP: android-${abi}"
          done

          echo "=== Flutter plugin native libraries ==="
          find $PLUGIN -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.a' | sort

      - name: Upload bundled plugin
        uses: actions/upload-artifact@v4
        with:
          name: flutter-plugin-bundled
          path: flutter/crispembed/

  result:
    name: Build result
    if: always()
    needs: [guards, build, sibling-crispasr, build-android, build-ios, bundle-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected build and reject unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_selection.py check --selector guards
          build=native sibling-crispasr=sibling build-android=mobile
          build-ios=mobile bundle-flutter=bundle
