name: OvisOCR3 original HF to native fourteen-arm audit
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native14:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reviewed OvisOCR3 original reference and service gate before dependencies or weights
        run: |
          mkdir -p "$RUNNER_TEMP/ovisocr3-native14/out" "$RUNNER_TEMP/ovisocr3-native14/scratch"
          {
            echo "HEAVY_OUT=$RUNNER_TEMP/ovisocr3-native14/out"
            echo "HEAVY_SCRATCH=$RUNNER_TEMP/ovisocr3-native14/scratch"
            echo "HF_HOME=$RUNNER_TEMP/ovisocr3-native14/scratch/hf"
          } >> "$GITHUB_ENV"
          HEAVY_OUT="$RUNNER_TEMP/ovisocr3-native14/out" HEAVY_SCRATCH="$RUNNER_TEMP/ovisocr3-native14/scratch" \
            python tools/ci-heavy/ovisocr3_native14.py --preflight
      - name: Pinned CPU conversion and original cast stack
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.16.1 tokenizers==0.23.3 numpy==2.2.6 pillow==12.1.0 huggingface-hub==1.33.0 gguf==0.19.0 safetensors==0.8.0
          python -m pip freeze > "$HEAVY_OUT/environment.txt"
      - name: Exercise installed dual-EOS criterion, verify original weights, export and replay fourteen arms
        run: python tools/ci-heavy/ovisocr3_native14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-native14-reports-${{ github.run_id }}
          path: ${{ env.HEAVY_OUT }}/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-native14-diff-${{ github.run_id }}
          path: ${{ env.HEAVY_SCRATCH }}/ovisocr3-native14/native-diff/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovisocr3-native14-f16-${{ github.run_id }}
          path: ${{ env.HEAVY_SCRATCH }}/ovisocr3-native14/ovisocr3-f16.gguf
          if-no-files-found: warn
          retention-days: 90
