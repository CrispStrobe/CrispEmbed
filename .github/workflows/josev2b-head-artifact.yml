name: Josev original preservation and F32 head component
on:
  workflow_call:
    secrets:
      KAGGLE_TOKEN:
        required: true
      JOSEV_REFERENCE_KERNEL:
        required: true
permissions:
  contents: read
jobs:
  preserve-convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      JOSEV_REFERENCE_KERNEL: ${{ secrets.JOSEV_REFERENCE_KERNEL }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Small original-first parser controls
        run: |
          python -B tests/test_josev2b_head_schema.py -v
          python -B tests/test_josev2b_head_artifact.py -v
      - name: Hosted array and artifact tooling
        run: python -m pip install numpy==2.2.6 gguf==0.17.1 kaggle==2.2.2
      - name: Authenticate all original arrays then convert exact original head
        run: python tools/ci-heavy/josev2b_head_artifact.py --output "$RUNNER_TEMP/josev-head-artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: josev-head-review-${{ github.run_id }}
          path: ${{ runner.temp }}/josev-head-artifact/review/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: josev-head-original-and-component-${{ github.run_id }}
          path: ${{ runner.temp }}/josev-head-artifact/
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn
