# OCR portfolio regression suite. See tests/regression/README.md.
#
# Motivated by 3fb1f8e: a vision-neck permute shipped garbage OCR
# (colorcolor…) that a pure exit-code smoke test could not catch. This
# suite asserts OUTPUT correctness (no-garbage guard + lenient CER match
# + optional per-layer diff-harness cos), not just that the process ran.
#
# Tiers:
#   Tier 0 smoke     (PR + push, <2s, no net):  manifest schema + parser +
#                                                CER/normalise + garbage guard
#   Tier 1 preflight (PR + push, ~5s, HF HEAD):  every pinned GGUF reachable
#   Tier 2 full      (nightly + dispatch):       build CPU + run got-ocr2
#                                                end-to-end (garbage + text +
#                                                diff-harness cos)
#
# The full GPU portfolio (all models) runs on Kaggle:
# tools/kaggle/ocr-portfolio-regression/.

name: OCR regression

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC nightly — Tier 2
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/got_ocr.cpp'
      - 'src/**ocr**'
      - 'src/scan_cleanup.*'
      - 'tests/regression/**'
      - 'tests/test_tesseract_page_geometry.py'
      - 'tests/test_tesseract_line_confidence.py'
      - 'src/tesseract_lstm.cpp'
      - 'src/fireredpunc.cpp'
      - 'src/pcs.cpp'
      - 'tests/firered_punc_parity.py'
      - 'tests/xlmr_punc_parity.py'
      - 'tests/pcs_parity.py'
      - 'tests/punct_ab.cpp'
      - 'tests/test_tesseract_runtime_contract.py'
      - 'tests/test_ppocrv6_pipeline_benchmark.py'
      - 'tests/test_ocr_backend_matrix.py'
      - 'tests/test_ocr_max_tokens_surfaces.py'
      - 'tests/test_easyocr_interop_contract.py'
      - 'tests/test_biometric_gate.py'
      - 'tests/test_image_root.py'
      - 'src/crispembed.cpp'
      - 'tools/scan_cleanup_bench.py'
      - '.github/workflows/regression.yml'
      - 'models/merge-llamacpp-qwen2vl-gguf.py'
      - 'models/export-mmproj-llamacpp.py'
      - 'tests/test_mmproj_interop.py'
      - 'models/merge-llamacpp-smolvlm-gguf.py'
      - 'models/gguf_merge_core.py'
      - 'tests/test_mmproj_smolvlm.py'
      - 'models/merge-llamacpp-internvl-gguf.py'
      - 'tests/test_mmproj_internvl.py'
      - 'models/merge-llamacpp-gguf.py'
      - 'tests/test_mmproj_dispatch.py'
  pull_request:
    paths:
      - 'src/got_ocr.cpp'
      - 'src/**ocr**'
      - 'src/scan_cleanup.*'
      - 'tests/regression/**'
      - 'tests/test_tesseract_page_geometry.py'
      - 'tests/test_tesseract_line_confidence.py'
      - 'src/tesseract_lstm.cpp'
      - 'tests/test_tesseract_runtime_contract.py'
      - 'tests/test_ppocrv6_pipeline_benchmark.py'
      - 'tests/test_ocr_backend_matrix.py'
      - 'tests/test_ocr_max_tokens_surfaces.py'
      - 'tests/test_easyocr_interop_contract.py'
      - 'tests/test_biometric_gate.py'
      - 'tests/test_image_root.py'
      - 'src/crispembed.cpp'
      - 'tools/scan_cleanup_bench.py'
      - '.github/workflows/regression.yml'
      - 'models/merge-llamacpp-qwen2vl-gguf.py'
      - 'models/export-mmproj-llamacpp.py'
      - 'tests/test_mmproj_interop.py'
      - 'models/merge-llamacpp-smolvlm-gguf.py'
      - 'models/gguf_merge_core.py'
      - 'tests/test_mmproj_smolvlm.py'
      - 'models/merge-llamacpp-internvl-gguf.py'
      - 'tests/test_mmproj_internvl.py'
      - 'models/merge-llamacpp-gguf.py'
      - 'tests/test_mmproj_dispatch.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # llama.cpp <-> CrispEmbed VL-model interop merges. Pure Python, no binary,
  # no network: synthesizes tiny fixtures and drives the real merge/export
  # scripts. Guards the silent 2026-07-12 interop bugs (Qwen2-VL: identity
  # naming, special-token injection, temporal-patch concat, merge<->export
  # inverse; SmolVLM: q/k un-permute, fc1/fc2 inversion, patch flatten).
  mmproj-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: python -m pip install --quiet numpy gguf
      - name: Qwen2-VL mmproj interop round-trip
        run: python tests/test_mmproj_interop.py
      - name: SmolVLM merge structure + un-permute
        run: python tests/test_mmproj_smolvlm.py
      - name: InternVL merge structure (QKV fuse, arch-conditional un-permute)
        run: python tests/test_mmproj_internvl.py
      - name: Unified merge dispatcher (projector_type routing)
        run: python tests/test_mmproj_dispatch.py

  # Tier 0: schema + parser + guard unit tests. No binary, no network.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Driver smoke test
        run: python tests/regression/test_driver_smoke.py
      - name: OCR engine matrix coverage
        run: python tests/regression/test_engine_matrix.py
      - name: Derived public-domain fixture integrity
        run: python tests/regression/test_derived_fixtures.py
      - name: Preprocessor benchmark policy
        run: python tests/test_ocr_preprocessor_benchmark.py
      - name: Tesseract page geometry comparator unit tests
        run: python tests/test_tesseract_page_geometry.py
      - name: Tesseract line confidence comparator unit tests
        run: python tests/test_tesseract_line_confidence.py
      - name: Tesseract runtime contract
        run: python tests/test_tesseract_runtime_contract.py
      - name: PP-OCRv6 benchmark parser contract
        run: python tests/test_ppocrv6_pipeline_benchmark.py
      - name: OCR engine benchmark manifest contract
        run: python tests/test_ocr_engine_benchmark.py
      - name: OCR backend capability matrix
        run: python tests/test_ocr_backend_matrix.py
      - name: VLM max-tokens reaches every surface
        run: python tests/test_ocr_max_tokens_surfaces.py
      - name: EasyOCR/LayoutLM interoperability contract
        run: python tests/test_easyocr_interop_contract.py
      - name: PP-OCRv6 graph gold lane (artifact-equipped runners only)
        env:
          CRISPEMBED_GGUF_DIR: ${{ vars.CRISPEMBED_GGUF_DIR }}
        run: |
          if [ -n "${CRISPEMBED_GGUF_DIR:-}" ] && [ -d "$CRISPEMBED_GGUF_DIR" ]; then
            python tests/test_ppocrv6_graph_gold.py --require --model-dir "$CRISPEMBED_GGUF_DIR" --ref-dir "$CRISPEMBED_GGUF_DIR"
          else
            echo "PP-OCRv6 graph gold: skipped (no artifact-equipped runner configured)"
          fi
      # POLICY.md §4 promises that loading a face recognition model requires an
      # explicit acknowledgement. Needs a built library and two face GGUFs, so
      # it only really runs on an artifact-equipped runner; elsewhere it says
      # so rather than reporting a pass it did not earn.
      - name: Biometric acknowledgement gate (artifact-equipped runners only)
        env:
          CRISPEMBED_GGUF_DIR: ${{ vars.CRISPEMBED_GGUF_DIR }}
        run: python tests/test_biometric_gate.py

      # POLICY.md §4 also tells deployers that --image-root confines request
      # paths. Same runner constraint, same honest skip when it cannot run.
      - name: Server --image-root confinement (artifact-equipped runners only)
        env:
          CRISPEMBED_GGUF_DIR: ${{ vars.CRISPEMBED_GGUF_DIR }}
        run: python tests/test_image_root.py

  # Tier 1: HEAD-check every pinned HF artifact the manifest references.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Preflight pinned artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tests/regression/preflight.py

  # Tier 2: full end-to-end on the CPU backend. Nightly / manual only —
  # PRs stop at smoke + preflight so they don't burn build+download time.
  full-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: preflight
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          pip install huggingface_hub
      - name: Build (CPU)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target crispembed-cli test-got-ocr-diff -j"$(nproc)"
      - name: Run got-ocr2 regression (CPU)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BUILD_DIR: build
          GOT_OCR_FORCE_CPU: '1'
          LD_LIBRARY_PATH: build
        run: python tests/regression/run_one.py --name got-ocr2
      # The smoke-tier copy of this can only skip: it has no build and no
      # models. Here both exist, and the two face models are small (37 MB +
      # 0.2 MB), so this is where POLICY.md §4 actually gets enforced.
      - name: Biometric acknowledgement gate (real run)
        env:
          LD_LIBRARY_PATH: build
        run: |
          mkdir -p .face-models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          for repo, name in (("cstr/yunet-GGUF", "yunet.gguf"), ("cstr/sface-GGUF", "sface.gguf")):
              shutil.copy(hf_hub_download(repo_id=repo, filename=name), f".face-models/{name}")
          PY
          python tests/test_biometric_gate.py \
            --det-model .face-models/yunet.gguf \
            --rec-model .face-models/sface.gguf \
            --build-dir build

      - name: Server --image-root confinement (real run)
        env:
          LD_LIBRARY_PATH: build
        run: |
          python tests/test_image_root.py \
            --det-model .face-models/yunet.gguf \
            --build-dir build

  # Punctuation parity against the Python/ONNX blueprints.
  #
  # All three punctuation engines got a blueprint reference (2026-08-25) and two
  # of the three had a real bug the day they got one: fireredpunc appended a
  # [SEP] its blueprint never emits (f16 cos_min 0.931 -> 1.000000), and the
  # XLM-R path returned EMPTY output on its default arm. Neither was visible
  # from an exit code or a smoke test — which is the same argument that
  # motivated this whole workflow.
  #
  # The references are checked in (8 KB each) and need no torch, no
  # transformers and no checkpoint. What they DO need is the GGUF, so this
  # cannot join the model-free tier and lives here with the other model-gated
  # jobs. ~690 MB of downloads, hence nightly/dispatch plus pushes that touch
  # the punctuation sources, not every push.
  punct-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build
          pip install huggingface_hub
      - name: Build the punctuation drivers
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target punct-ab firered-punct-ab -j"$(nproc)"
      - name: Fetch models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .punct-models
          python - <<'PY'
          import shutil
          from huggingface_hub import hf_hub_download
          # f16 for fireredpunc: the gate there is structural (cos >= 0.99), and
          # f16 is the arm that separates a graph bug from quantisation — a
          # k-quant alone cannot make that call.
          # q4_k-imatrix for pcs: that IS the registry default, so CI checks what
          # users actually download.
          # q4_k for fullstop-punc: q8_0 is 600 MB and the structural break this
          # guards against is visible at either precision (with a looser floor).
          for repo, name in (
              ("cstr/fireredpunc-GGUF", "fireredpunc.gguf"),
              ("cstr/pcs-xlmr-base-GGUF", "pcs-xlmr-base-q4_k-imatrix.gguf"),
              ("cstr/fullstop-punc-multilang-GGUF", "fullstop-punc-q4_k.gguf"),
          ):
              shutil.copy(hf_hub_download(repo_id=repo, filename=name), f".punct-models/{name}")
              print("got", name, flush=True)
          PY
      - name: fireredpunc (BERT) vs blueprint
        env: { LD_LIBRARY_PATH: build }
        run: |
          python tests/firered_punc_parity.py build \
            .punct-models/fireredpunc.gguf \
            tests/regression/fireredpunc/blueprint_ref.txt
      - name: PCS — all four heads vs blueprint
        env: { LD_LIBRARY_PATH: build }
        run: |
          python tests/pcs_parity.py build \
            .punct-models/pcs-xlmr-base-q4_k-imatrix.gguf \
            tests/regression/pcs/blueprint_ref.txt
      - name: fullstop-punc (XLM-R) vs blueprint
        env: { LD_LIBRARY_PATH: build }
        # 0.90 floor: this is the q4_k arm, and q4_k on a 24-layer model reaches
        # cos_min 0.923 against an f32 reference while still agreeing with it on
        # every argmax. Measured, not assumed — the q8_0 arm of the same graph
        # is 0.9987, which is how the two were told apart. A floor tighter than
        # the quant would fail nightly for no defect.
        run: |
          python tests/xlmr_punc_parity.py build \
            .punct-models/fullstop-punc-q4_k.gguf \
            tests/regression/fullstop_punc/blueprint_ref.txt 0.90

  # scan_cleanup do-no-harm guard. Classical (tier-1) preprocessing needs no
  # model and no network, so this runs on every PR/push that touches the
  # cleanup code — unlike the OCR tiers it doesn't gate on HF reachability.
  # It asserts the invariant that matters: cleanup must never make OCR-CER
  # worse than the degraded input (measured with tesseract). See
  # tools/scan_cleanup_bench.py --fail-on-harm.
  scan-cleanup-noharm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps (build + tesseract + python)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential tesseract-ocr
          pip install pillow numpy pytesseract
      - name: Build CLI (CPU)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target crispembed-cli -j"$(nproc)"
      - name: Do-no-harm guard on PD scan fixture
        env:
          LD_LIBRARY_PATH: build
        run: |
          python tools/scan_cleanup_bench.py \
            --image tests/regression/images/scan_page_pd.png \
            --bin build/crispembed \
            --no-unpaper --fail-on-harm
