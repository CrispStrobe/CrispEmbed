name: spaCy Linux package controls

on:
  pull_request:
    paths:
      - 'tools/spacy/distribution*.py'
      - 'tests/test_spacy_distribution*.py'
      - 'docs/validation/native-spacy-w7-20261118/**'
      - '.github/workflows/spacy-linux-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spacy-linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Closed archive and atomic installer controls (no native/model load)
        run: python3 -B tests/test_spacy_distribution.py -v
      - name: Consumer engineering controls (no native/model load)
        run: python3 -B tests/test_spacy_distribution_consumer.py -v
      - name: Independently authenticate retained Linux evidence
        run: >-
          python3 -B docs/validation/native-spacy-w7-20261118/completion-20261118/audit_retained_python_package.py
          --repo . --output package-retained-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: spacy-linux-package-retained-audit
          path: package-retained-audit.json
          retention-days: 90
