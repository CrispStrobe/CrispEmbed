// CrispEmbed Flutter FFI plugin — Android
//
// Bundles pre-built libcrispembed.so for each ABI. CI (release.yml, build-android
// job) builds each self-contained .so and publishes it as a release asset; the
// fetchCrispembedLibs task below downloads it into src/main/jniLibs/<abi>/ on
// build (skipped if already present — e.g. a local dev drop).

group 'com.crispstrobe.crispembed'
version '0.16.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.crispstrobe.crispembed'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    // Pre-built .so files live in src/main/jniLibs/<abi>/.
    // Gradle bundles them automatically — no externalNativeBuild needed.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// Fetch the CI-built libcrispembed.so for each ABI from the matching GitHub
// release, if not already present. Runs before the build so `flutter build apk`
// works on a fresh checkout without any manual lib placement.
def crispembedAbis = ['arm64-v8a', 'armeabi-v7a']

// Gradle 9 removed Project.exec() from the EXECUTION phase, so the plain
// `exec { }` this task used to call inside doLast now fails the whole build
// with "Could not find method exec()". The supported replacement is the
// injected ExecOperations service; ObjectFactory.newInstance fills the
// @Inject for us. See https://docs.gradle.org/current/userguide/upgrading_version_8.html
interface CrispembedExecOps {
    @javax.inject.Inject
    org.gradle.process.ExecOperations getExecOps()
}

tasks.register('fetchCrispembedLibs') {
    // Resolve everything that touches `project` at CONFIGURATION time — reading
    // it from doLast is the same class of error as exec() was.
    def execOps = project.objects.newInstance(CrispembedExecOps).execOps
    def jniLibsDir = file('src/main/jniLibs')
    def releaseVersion = version.toString()
    doLast {
        crispembedAbis.each { abi ->
            def dst = new File(jniLibsDir, "${abi}/libcrispembed.so")
            if (!dst.exists()) {
                dst.parentFile.mkdirs()
                def url = "https://github.com/CrispStrobe/CrispEmbed/releases/download/v${releaseVersion}/crispembed-android-${abi}.tar.gz"
                logger.lifecycle("crispembed: fetching prebuilt Android lib (${abi}) -> ${url}")
                def tmp = File.createTempFile('crispembed', '.tgz')
                new URL(url).withInputStream { input -> tmp.withOutputStream { out -> out << input } }
                execOps.exec {
                    commandLine 'tar', '-xzf', tmp.absolutePath, '-C',
                            dst.parentFile.absolutePath, 'libcrispembed.so'
                }
                tmp.delete()
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn('fetchCrispembedLibs')
}
