[package]
name = "crispembed-sys"
# Tracks the C library version in /VERSION. Bump on every C ABI change.
version = "0.17.8"
edition = "2021"
description = "Raw FFI bindings to the crispembed C library (ggml-based multilingual text embeddings). Use the safe `crispembed` crate unless you need direct C ABI access."
license = "MIT"
repository = "https://github.com/CrispStrobe/CrispEmbed"
homepage = "https://github.com/CrispStrobe/CrispEmbed"
readme = "../README.md"
keywords = ["embeddings", "ffi", "ggml", "bindings", "bert"]
categories = ["external-ffi-bindings", "text-processing"]
links = "crispembed"
build = "build.rs"

# The C/C++ sources are vendored into vendor/ by scripts/vendor_rust_sources.sh
# — cargo only packages files under the crate root, so the in-tree ../src and
# ../ggml are unreachable from the published tarball. `include` also OVERRIDES
# .gitignore, which is what lets the generated tree ship without committing a
# 26 MB duplicate of the repository.
include = [
    "src/**/*.rs",
    "build.rs",
    "vendor/**",
]

[features]
cuda   = []
metal  = []
vulkan = []
