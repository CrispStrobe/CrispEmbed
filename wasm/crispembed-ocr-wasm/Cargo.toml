[package]
name = "crispembed-ocr-wasm"
version = "0.3.0"
edition = "2021"
description = "Rust wrapper for CrispEmbed OCR WASM — client-side OCR via WebAssembly"
license = "MIT"
repository = "https://github.com/CrispStrobe/CrispEmbed"
keywords = ["ocr", "wasm", "webassembly", "ggml"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Response",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
